];

        // 玩家資料 (初始背包塞滿東西以測試滑動)
        let inventory = { 'wood': 20, 'stone': 10, 'apple': 5, 'meat_pig': 3, 'salt': 10, 'carrot': 5, 'tomato': 5, 'cabbage': 5, 'diamond': 1, 'dirt': 10, 'salt_ore': 2 }; 
        let hotbarSlots = Object.keys(inventory); // 初始全放快捷
        let selectedSlotIndex = 0;
        let hp = 100, energy = 100;
        let luckEndTime = 0;

        // 魔王題目 (保底數據，實際應由外部 paper_generator 生成)
        let bossQuestions = [
            { question: "國八理化：當冰塊融化成水時，下列何者「不變」？", options: ["體積", "密度", "質量", "狀態"], answer: 2 },
            { question: "國八理化：密度(D)、質量(M)、體積(V)的關係為何？", options: ["D=M*V", "D=V/M", "D=M/V", "M=D/V"], answer: 2 }
        ];
        let currentBossQ = null;

        // ==========================================
        // 2. UI 更新與互動邏輯 (核心修復)
        // ==========================================
        function showMsg(txt, color='#fbbf24') { const m = document.getElementById('msg-box'); m.innerText = txt; m.style.color = color; m.style.opacity = 1; setTimeout(() => m.style.opacity = 0, 2000); }

        function updateStats(hpChange, energyChange) {
            hp = Math.max(0, Math.min(100, hp + hpChange)); energy = Math.max(0, Math.min(100, energy + energyChange));
            document.getElementById('hp-fill').style.width = `${hp}%`; document.getElementById('hp-txt').innerText = Math.floor(hp);
            document.getElementById('energy-fill').style.width = `${energy}%`; document.getElementById('energy-txt').innerText = Math.floor(energy);
            if (hp <= 0) { showMsg("💀 你餓死/摔死了！", "red"); resetPlayer(); }
        }
        function resetPlayer() { camera.position.set(0, 5, 0); hp = 100; energy = 100; updateStats(0,0); }

        // 吃東西
        function consumeItem(itemId) {
            const item = ITEM_REGISTRY[itemId];
            if (item && item.type === 'food' && inventory[itemId] > 0) {
                inventory[itemId]--;
                updateStats(item.h||0, item.e);
                showMsg(`😋 吃了 ${item.n}！`, '#10b981');
                if (inventory[itemId] <= 0) { delete inventory[itemId]; }
                renderUI();
            }
        }

        // 🚀 核心修復：渲染 6格滑動快捷列
        function renderUI() {
            // 側邊欄背包
            const invDiv = document.getElementById('inventory-list'); invDiv.innerHTML = '';
            Object.keys(inventory).forEach(key => {
                if(inventory[key] > 0) {
                    const item = ITEM_REGISTRY[key];
                    invDiv.innerHTML += `<div class="slot bg-slate-800" title="${item.n}">${item.i}<span class="slot-count">${inventory[key]}</span></div>`;
                }
            });

            // 合成表
            const recDiv = document.getElementById('recipe-list'); recDiv.innerHTML = '';
            RECIPES.forEach(r => {
                const canCraft = r.req.every(req => (inventory[req.id] || 0) >= req.count);
                let reqHtml = r.req.map(req => `<span class="text-xs bg-black/40 px-1 rounded">${ITEM_REGISTRY[req.id].i}x${req.count}</span>`).join(' ');
                recDiv.innerHTML += `
                    <div class="flex justify-between items-center p-2 rounded ${canCraft ? 'bg-blue-900/60' : 'bg-slate-800 opacity-50'}">
                        <div class="flex items-center gap-2"><span class="text-2xl">${ITEM_REGISTRY[r.id].i}</span>
                        <div><div class="font-bold text-sm">${r.n}</div><div class="flex gap-1 mt-1">${reqHtml}</div></div></div>
                        <button onclick="craft('${r.id}')" class="px-3 py-1 bg-blue-600 rounded text-xs text-white ${!canCraft?'hidden':''}">合成</button>
                    </div>`;
            });

            // 🚀 快捷列 (支援滑動與自動對齊)
            const hotbarDiv = document.getElementById('hotbar'); hotbarDiv.innerHTML = '';
            // 整理快捷列數據 (移除數量為0的物品)
            hotbarSlots = Object.keys(inventory).filter(id => inventory[id] > 0);
            if(selectedSlotIndex >= hotbarSlots.length) selectedSlotIndex = 0;

            hotbarSlots.forEach((itemId, i) => {
                const item = ITEM_REGISTRY[itemId];
                const div = document.createElement('div');
                div.className = `slot ${i === selectedSlotIndex ? 'active' : ''}`;
                div.innerHTML = `${item.i}<span class="slot-count">${inventory[itemId]}</span>`;
                
                div.onclick = (e) => {
                    // 如果點擊的是食物，且已經是選中狀態，就吃掉
                    if (selectedSlotIndex === i && item.type === 'food') { consumeItem(itemId); }
                    else { selectedSlotIndex = i; }
                    renderUI();
                    // 🚀 自動捲動到中間對齊
                    div.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                };
                hotbarDiv.appendChild(div);
            });

            // 更新手持物
            const currentItem = hotbarSlots[selectedSlotIndex];
            document.getElementById('view-model').innerText = currentItem ? ITEM_REGISTRY[currentItem].i : '👊';
        }

        function craft(recipeId) {
            const r = RECIPES.find(x => x.id === recipeId);
            if(r.req.every(req => (inventory[req.id] || 0) >= req.count)) {
                r.req.forEach(req => inventory[req.id] -= req.count);
                inventory[r.id] = (inventory[r.id] || 0) + r.outCount;
                showMsg(`🔨 合成了 ${ITEM_REGISTRY[r.id].n}`, '#3b82f6');
                renderUI();
            }
        }

        // ==========================================
        // 3. 👹 閻羅王題目方塊 (Boss) 與 準心系統
        // ==========================================
        let isBossQuizOpen = false;

        // 💥 啟動閻羅王挑戰
        function openBossQuiz() {
            if (isBossQuizOpen || energy < 20) return;
            isBossQuizOpen = true;
            document.getElementById('boss-quiz-overlay').style.display = 'block';
            
            // 嘗試從外部 paper_generator 抓取題目，Standalone模式下用保底
            if(window.generatePaper) {
                try {
                    const cloudQ = window.generatePaper({ subject: 'physics', total: 1, tags: ['大魔王', '國八'] });
                    if(cloudQ && cloudQ.length > 0) bossQuestions = cloudQ;
                } catch(e) {}
            }

            currentBossQ = bossQuestions[Math.floor(Math.random() * bossQuestions.length)];
            document.getElementById('boss-question').innerHTML = currentBossQ.question.replace(/\n/g, '<br>');
            
            const ops = document.getElementById('boss-options'); ops.innerHTML = '';
            currentBossQ.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "quiz-btn w-full text-left p-3 rounded-lg bg-slate-800 border border-slate-700";
                btn.innerHTML = `${String.fromCharCode(65+idx)}. ${opt}`;
                btn.onclick = () => checkBossAnswer(idx);
                ops.appendChild(btn);
            });
            if(window.MathJax) MathJax.typesetPromise();
        }

        function checkBossAnswer(selectedIdx) {
            if (selectedIdx === currentBossQ.answer) {
                showMsg("🎉 正確！地府認證理化王！獲得獎勵", "#10b981");
                inventory['diamond'] = (inventory['diamond'] || 0) + 2;
                inventory['cooked_meat_salted'] = (inventory['cooked_meat_salted'] || 0) + 1;
                setTimeout(() => { closeBossQuiz(true); }, 1500);
            } else {
                showMsg("💥 答錯了！受到地府的懲罰！", "red");
                updateStats(-30, -10);
                setTimeout(() => closeBossQuiz(false), 1500);
            }
        }

        function closeBossQuiz(isVictory = false) {
            document.getElementById('boss-quiz-overlay').style.display = 'none';
            isBossQuizOpen = false;
            if(!isVictory) updateStats(0, -10); // 逃跑扣體力
            renderUI();
        }

        // 🎯 動態準心系統 與 目標移動監測
        const raycaster = new THREE.Raycaster();
        const center = new THREE.Vector2(0, 0);

        function updateCrosshairSystem() {
            raycaster.setFromCamera(center, camera);
            
            // 檢測所有物體 (方塊與動物群)
            const allTargets = [ bossEntity, ...scene.children.filter(obj => obj.geometry && obj.geometry.type === 'BoxGeometry'), ...entities.map(e => e.group) ];
            const intersects = raycaster.intersectObjects(allTargets, true);
            
            const crosshairEl = document.getElementById('crosshair');
            const targetInfoEl = document.getElementById('target-info');

            if (intersects.length > 0 && intersects[0].distance < 10) {
                const target = intersects[0].object;
                const dist = Math.floor(intersects[0].distance);
                crosshairEl.style.transform = 'scale(1.3)'; // 放大準心
                targetInfoEl.style.opacity = '1';

                // 辨識目標
                if (target === bossEntity) {
                    crosshairEl.style.color = '#ef4444'; // 魔王變紅
                    targetInfoEl.innerText = `👹 閻羅王 (題目方塊) (${dist}m)`;
                } else if (target.parent && target.parent.userData.type) { // 是動物
                    crosshairEl.style.color = '#fbbf24'; // 動物變黃
                    const type = target.parent.userData.type;
                    targetInfoEl.innerText = `${type === 'pig' ? '🐷' : '🐮'} 動物 (${dist}m)`;
                } else { // 是方塊
                    crosshairEl.style.color = 'rgba(255,255,255,0.9)'; // 變白
                    const bType = target.userData.type;
                    targetInfoEl.innerText = `🧱 ${ITEM_REGISTRY[bType] ? ITEM_REGISTRY[bType].n : '方塊'} (${dist}m)`;
                }
            } else {
                // 瞄準空白
                crosshairEl.style.transform = 'scale(1)'; crosshairEl.style.color = 'rgba(255,255,255,0.8)'; targetInfoEl.style.opacity = '0';
            }
        }

        // ==========================================
        // 4. Three.js: 世界建設 (無限地形、生態、Boss)
        // ==========================================
        const scene = new THREE.Scene(); scene.fog = new THREE.FogExp2(0x87CEEB, 0.05);
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 100);
        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio > 1 ? 1.5 : 1);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.5); dirLight.position.set(10, 20, 10); scene.add(dirLight);

        // 材質
        function createColorMat(color) { return new THREE.MeshLambertMaterial({ color }); }
        const MATS = {
            grass: createColorMat(0x55aa55), dirt: createColorMat(0x8b5a2b), stone: createColorMat(0x888888),
            wood: createColorMat(0x5c4033), leaves: createColorMat(0x228b22), pig: createColorMat(0xffc0cb),
            cow: createColorMat(0x7f4c1e), salt: createColorMat(0xffffff),
            boss: new THREE.MeshPhongMaterial({ color: 0x220000, emissive: 0xef4444 }) // 黑紅色脈動
        };
        const boxGeo = new THREE.BoxGeometry(1, 1, 1);

        // 地形與實體
        const blocks = new Map();
        const entities = [];
        let bossEntity = null;
        noise.seed(Math.random());
        
        function getBlockKey(x, y, z) { return `${Math.floor(x)},${Math.floor(y)},${Math.floor(z)}`; }
        
        function addBlock(x, y, z, type) {
            const mesh = new THREE.Mesh(boxGeo, MATS[type] || MATS.dirt);
            mesh.position.set(x, y, z); mesh.userData.type = type;
            scene.add(mesh); blocks.set(getBlockKey(x, y, z), mesh);
        }

        // 👹 建立閻羅王 Boss (題目方塊) - 黑紅色巨大方塊
        function spawnBoss() {
            bossEntity = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), MATS.boss);
            bossEntity.position.set(0, 10, -20); // 初始座標
            bossEntity.userData.isBoss = true;
            scene.add(bossEntity);
        }

        // 🐖🐄 動物 (流暢 AI 與自動跳躍)
        function spawnAnimal(type) {
            const group = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.6, 1.2), MATS[type]); body.position.y = 0.6; group.add(body);
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), MATS[type]); head.position.set(0, 0.8, -0.7); group.add(head);
            
            group.position.set((Math.random()-0.5)*30, 5, (Math.random()-0.5)*30);
            group.userData = { type, velY: 0, isJumping: false };
            scene.add(group);
            entities.push({ group, velocity: new THREE.Vector3(0, 0, 0), nextStateTime: 0, state: 'idle' });
        }

        // 🌱 植物樹林生成
        function spawnTree(x, z, h) {
            for(let y=h+1; y<=h+3; y++) addBlock(x, y, z, 'wood'); // 樹幹
            for(let ox=-1; ox<=1; ox++) for(let oz=-1; oz<=1; oz++) addBlock(x+ox, h+4, z+oz, 'leaves'); // 樹葉
        }

        // 🧱 無限地形延伸核心
        const generatedChunks = new Set();
        const CHUNK_SIZE = 8;

        function updateInfiniteTerrain() {
            const px = Math.floor(camera.position.x / CHUNK_SIZE); const pz = Math.floor(camera.position.z / CHUNK_SIZE);
            const viewDist = 2;
            for (let x = px - viewDist; x <= px + viewDist; x++) {
                for (let z = pz - viewDist; z <= pz + viewDist; z++) {
                    const chunkKey = `${x},${z}`;
                    if (!generatedChunks.has(chunkKey)) {
                        generateChunk(x, z); generatedChunks.add(chunkKey);
                    }
                }
            }
        }

        function generateChunk(cx, cz) {
            for (let x = 0; x < CHUNK_SIZE; x++) {
                for (let z = 0; z < CHUNK_SIZE; z++) {
                    const wx = cx * CHUNK_SIZE + x; const wz = cz * CHUNK_SIZE + z;
                    let h = Math.floor(noise.perlin2(wx/15, wz/15) * 4) + 2;
                    for(let y = -1; y <= h; y++) {
                        let type = y === h ? 'grass' : (y > h-2 ? 'dirt' : 'stone');
                        // 隨機鹽礦與草叢
                        if(y === h && Math.random() < 0.05) type = 'salt_ore';
                        addBlock(wx, y, wz, type);
                    }
                    // 長樹林
                    if (wx !== 0 && wz !== 0 && Math.random() < 0.02) spawnTree(wx, wz, h);
                }
            }
        }

        // 初始化世界
        updateInfiniteTerrain();
        camera.position.set(0, 5, 0);
        spawnBoss();
        for(let i=0; i<15; i++) spawnAnimal(i % 2 === 0 ? 'pig' : 'cow');

        // ==========================================
        // 5. 互動、移動與按鈕控制
        // ==========================================
        let moveInput = { x: 0, y: 0 }, lookInput = { x: 0, y: 0 };
        let playerVelocityY = 0;
        const keysPressed = {};
        const clock = new THREE.Clock();

        // 👁️ 互動按鈕邏輯 (電腦空白鍵/手機藍按鈕)
        function handleInteraction() {
            if (isQuizOpen) return;
            raycaster.setFromCamera(center, camera);
            // 優先檢測閻羅王 Boss
            const intersectBoss = raycaster.intersectObject(bossEntity);
            if(intersectBoss.length > 0 && intersectBoss[0].distance < 8) {
                openBossQuiz();
                return;
            }
            
            // 其次檢測一般互動 (例如打開背包，這裡用訊息代替)
            const intersects = raycaster.intersectObjects(scene.children, true);
            if(intersects.length > 0 && intersects[0].distance < 5) {
                const target = intersects[0].object;
                if(target.userData.type === 'salt_ore') showMsg("🧂 這是一塊鹽礦，用鎬子開採！");
                else if(target.parent && target.parent.userData.type) showMsg("🐮🐷 這是一隻小動物！");
            }
        }

        function swingHand() {
            const vm = document.getElementById('view-model');
            vm.classList.remove('swing'); void vm.offsetWidth; vm.classList.add('swing');
            updateStats(0, -1); // 動作消耗體力
        }

        function handleBreak() {
            raycaster.setFromCamera(center, camera);
            const intersects = raycaster.intersectObjects(scene.children).filter(i => i.object.geometry.type === 'BoxGeometry');
            if (intersects.length > 0 && intersects[0].distance < 5) {
                swingHand();
                const target = intersects[0].object;
                if(target === bossEntity) { showMsg("👹 閻羅王不可破壞！請按互動鍵挑戰題目", "red"); return; }
                const p = target.position; scene.remove(target);
                blocks.delete(getBlockKey(p.x, p.y, p.z));
                // 掉落
                const type = target.userData.type || 'dirt';
                inventory[type] = (inventory[type] || 0) + 1;
                renderUI();
            }
        }

        function handlePlace() {
            const currentItem = hotbarSlots[selectedSlotIndex];
            if (!currentItem || ITEM_REGISTRY[currentItem].type !== 'block' || inventory[currentItem] <= 0) return;
            raycaster.setFromCamera(center, camera);
            const intersects = raycaster.intersectObjects(scene.children).filter(i => i.object.geometry.type === 'BoxGeometry');
            if (intersects.length > 0 && intersects[0].distance < 5) {
                swingHand();
                const normal = intersects[0].face.normal;
                const pos = intersects[0].object.position.clone().add(normal);
                addBlock(pos.x, pos.y, pos.z, currentItem);
                inventory[currentItem]--;
                renderUI();
            }
        }

        // 鍵盤移動與數字鍵
        document.addEventListener('keydown', e => {
            keysPressed[e.key.toLowerCase()] = true;
            if(['1','2','3','4','5','6','7','8'].includes(e.key)) {
                selectedSlotIndex = parseInt(e.key) - 1;
                if(selectedSlotIndex < hotbarSlots.length) { renderUI(); document.querySelector(`.slot:nth-child(${selectedSlotIndex+1})`).scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' }); }
            }
            if(e.key === ' ' && !isQuizOpen) { handleInteraction(); e.preventDefault(); } // 空白鍵互動
        });
        document.addEventListener('keyup', e => keysPressed[e.key.toLowerCase()] = false);

        // 搖桿設置
        function setupJoy(id, knobId, outObj) {
            const zone = document.getElementById(id), knob = document.getElementById(knobId);
            let activeId = null; let centerX, centerY;
            zone.addEventListener('touchstart', e => { e.preventDefault(); activeId = e.changedTouches[0].identifier; const r = zone.getBoundingClientRect(); centerX = r.left + r.width/2; centerY = r.top + r.height/2; }, {passive:false});
            zone.addEventListener('touchmove', e => {
                e.preventDefault();
                for(let i=0; i<e.changedTouches.length; i++) {
                    if(e.changedTouches[i].identifier === activeId) {
                        const t = e.changedTouches[i];
                        let dx = t.clientX - centerX, dy = t.clientY - centerY;
                        const dist = Math.sqrt(dx*dx+dy*dy); const maxR = 40;
                        if(dist>maxR) { dx *= maxR/dist; dy *= maxR/dist; }
                        knob.style.transform = `translate(${dx}px, ${dy}px)`;
                        outObj.x = dx/maxR; outObj.y = dy/maxR;
                    }
                }
            }, {passive:false});
            zone.addEventListener('touchend', e => { for(let i=0; i<e.changedTouches.length; i++) if(e.changedTouches[i].identifier === activeId) { activeId=null; knob.style.transform='translate(0,0)'; outObj.x=0; outObj.y=0; } });
        }
        setupJoy('joystick-move', 'knob-move', moveInput);
        setupJoy('joystick-look', 'knob-look', lookInput);

        // 遊戲主迴圈
        function updateGame() {
            requestAnimationFrame(updateGame);
            const delta = clock.getDelta(); const time = Date.now();
            if(isQuizOpen) { renderer.render(scene, camera); return; }

            // 1. 視角
            camera.rotation.y -= lookInput.x * 0.05;
            camera.rotation.x -= lookInput.y * 0.05;
            camera.rotation.x = Math.max(-1.5, Math.min(1.5, camera.rotation.x));
            
            // 2. 移動與地形延伸
            const speed = 0.15; const dir = new THREE.Vector3();
            if(keysPressed['w']) dir.z -= 1; if(keysPressed['s']) dir.z += 1;
            if(keysPressed['a']) dir.x -= 1; if(keysPressed['d']) dir.x += 1;
            if(moveInput.x !== 0 || moveInput.y !== 0) { dir.x += moveInput.x; dir.z += moveInput.y; }
            if(dir.length()>0) {
                dir.normalize().applyAxisAngle(new THREE.Vector3(0,1,0), camera.rotation.y);
                camera.position.addScaledVector(dir, speed);
                updateInfiniteTerrain();
            }

            // 3. 重力 與 準心瞄準
            playerVelocityY = blocks.has(getBlockKey(camera.position.x, camera.position.y-1.8, camera.position.z)) ? 0 : playerVelocityY - 0.01;
            camera.position.y += playerVelocityY; if(camera.position.y < -10) resetPlayer();
            updateCrosshairSystem();

            // 4. 🧭 閻羅王導航 UI 更新
            if(bossEntity) {
                const dist = Math.floor(camera.position.distanceTo(bossEntity.position));
                document.getElementById('boss-dist').innerText = dist;
                // 魔王脈動效果
                bossEntity.scale.set(2 + Math.sin(time*0.005)*0.1, 2 + Math.sin(time*0.005)*0.1, 2 + Math.sin(time*0.005)*0.1);
            }

            // 5. 動物 AI (自動跳躍)
            entities.forEach(ent => {
                const group = ent.group; const data = group.userData;
                if (time > ent.nextStateTime) {
                    const rnd = Math.random();
                    if(rnd < 0.4) { ent.state = 'idle'; ent.velocity.set(0,0,0); }
                    else { ent.state = 'wander'; ent.velocity.set((Math.random()-0.5)*0.03, 0, (Math.random()-0.5)*0.03); }
                    ent.nextStateTime = time + 2000 + Math.random()*3000;
                }
                // 移動與跳躍
                const nextPos = group.position.clone().add(ent.velocity);
                const blockAheadKey = getBlockKey(nextPos.x, group.position.y, nextPos.z);
                if(blocks.has(blockAheadKey) && !data.isJumping) {
                    data.velY = 0.15; data.isJumping = true; // 自動跳躍
                }
                group.position.add(ent.velocity);
                const feetKey = getBlockKey(group.position.x, group.position.y-0.1, group.position.z);
                data.velY = blocks.has(feetKey) ? Math.max(0, data.velY) : data.velY - 0.01;
                if(blocks.has(feetKey)) data.isJumping = false;
                group.position.y += data.velY;
                if(g.position.y < -5) g.position.y = 5; // 掉落防呆
            });

            renderer.render(scene, camera);
        }

        // 初始化
        window.onload = () => { renderUI(); updateStats(0,0); updateGame(); };
        window.addEventListener('resize', () => { camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });

    </script>
</body>
</html>
