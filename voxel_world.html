<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D 生存世界 - 終極手機完美版</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/gh/josephg/noisejs/perlin.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="mockdata/users.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/generator_engine.js"></script>
    <script src="mockdata/generator_engine_polyfill.js"></script>
    <script src="mockdata/AutoTemplateFissionFactory.js"></script>
    <script src="mockdata/auto_fission_bootstrap.js"></script>
    <script src="mockdata/paper_generator.js"></script>
    <script src="mockdata/curriculum_integrated.js"></script>
    
    <script src="mockdata/templates_math_algebra_geometry.js"></script>
    <script src="mockdata/templates_physics_multistep.js"></script>
    <script src="mockdata/templates_chemistry_core.js"></script>
    <script src="mockdata/templates_biology_core.js"></script>
    <script src="mockdata/templates_earth_science_core.js"></script>
    <script src="mockdata/templates_english_core.js"></script>
    <script src="mockdata/templates_chinese_core.js"></script>
    <script src="mockdata/templates_history_core.js"></script>
    <script src="mockdata/templates_geography_core.js"></script>
    <script src="mockdata/templates_civics_core.js"></script>
    <style>
        /* 基礎設定防反白、防縮放 */
        body { margin: 0; overflow: hidden; font-family: 'Noto Sans TC', sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; background-color: #87CEEB; }
        
        /* 系統訊息與UI */
        #msg-box { position: fixed; top: 15%; left: 50%; transform: translateX(-50%); font-size: 22px; font-weight: bold; color: #fbbf24; text-shadow: 2px 2px 4px black; z-index: 100; opacity: 0; transition: opacity 0.3s; pointer-events: none; width: 100%; text-align: center; }
        #crosshair { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: rgba(255,255,255,0.8); font-size: 30px; pointer-events: none; z-index: 10; text-shadow: 0 0 3px black; }
        #view-model { position: fixed; bottom: -30px; right: 15%; font-size: 120px; z-index: 15; transform-origin: bottom right; transition: transform 0.1s; pointer-events: none; filter: drop-shadow(0px 10px 10px rgba(0,0,0,0.5)); }
        
        /* 狀態條 (右上角) */
        .status-ui { position: fixed; top: 15px; right: 15px; background: rgba(0,0,0,0.6); padding: 12px; border-radius: 12px; color: white; z-index: 20; min-width: 160px; pointer-events: none; backdrop-filter: blur(4px); }
        .stat-bar { width: 100%; height: 12px; background: #333; border-radius: 6px; margin-top: 4px; overflow: hidden; border: 1px solid #555; }
        .hp-fill { height: 100%; background: #ef4444; width: 100%; transition: width 0.3s; }
        .energy-fill { height: 100%; background: #10b981; width: 100%; transition: width 0.3s; }
        #luck-overlay { display: none; position: fixed; top: 80px; left: 50%; transform: translateX(-50%); color: #fbbf24; font-weight: bold; font-size: 18px; text-shadow: 2px 2px 4px black; z-index: 20; }

        /* 左側選單按鈕與側邊欄 */
        .toggle-btn { position: fixed; top: 15px; left: 15px; z-index: 60; background: rgba(0,0,0,0.6); color: white; padding: 10px 15px; border-radius: 8px; cursor: pointer; backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.2); pointer-events: auto; }
        #sidebar { position: fixed; top: 0; left: -350px; width: 350px; height: 100vh; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); z-index: 50; transition: left 0.3s; color: white; padding: 20px; overflow-y: auto; border-right: 2px solid rgba(255,255,255,0.1); }
        #sidebar.open { left: 0; }
        #inventory-list, #recipe-list { max-height: 300px; overflow-y: auto; }

        /* 🚀 快捷列：緊貼底部，防遮擋 */
        #hotbar { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 16px; z-index: 40; backdrop-filter: blur(4px); pointer-events: auto; }
        .slot { width: 45px; height: 45px; border: 2px solid #555; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 24px; color: white; position: relative; cursor: pointer; background: rgba(255,255,255,0.1); }
        .slot.active { border-color: #fbbf24; background: rgba(251, 191, 36, 0.3); box-shadow: 0 0 15px rgba(251,191,36,0.8); transform: scale(1.1); transition: 0.1s; }
        .slot-count { position: absolute; bottom: 2px; right: 4px; font-size: 12px; font-weight: bold; text-shadow: 1px 1px 2px black; }

        /* 🚀 搖桿區：大幅往上移，絕對不擋快捷列 */
        .joystick-zone { position: fixed; bottom: 120px; width: 130px; height: 130px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; z-index: 30; backdrop-filter: blur(4px); pointer-events: auto; }
        #joystick-move { left: 30px; }
        #joystick-look { right: 30px; background: rgba(255,100,100,0.1); border-color: rgba(255,100,100,0.3); }
        .joystick-knob { position: absolute; top: 40px; left: 40px; width: 50px; height: 50px; background: rgba(255,255,255,0.8); border-radius: 50%; pointer-events: none; }
        #joystick-look .joystick-knob { background: rgba(255,100,100,0.8); }
        .aim-label { position: absolute; top: -25px; left: 50%; transform: translateX(-50%); color: white; font-size: 14px; font-weight: bold; text-shadow: 1px 1px 2px black; pointer-events: none; }

        /* 🚀 互動按鈕：右側中間偏下 */
        #controls { position: fixed; bottom: 270px; right: 30px; z-index: 30; display: flex; flex-direction: column; gap: 15px; pointer-events: auto; }
        .action-btn { width: 60px; height: 60px; border-radius: 50%; background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.5); color: white; display: flex; align-items: center; justify-content: center; font-size: 24px; backdrop-filter: blur(4px); }
        .action-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.4); }

        /* 彈窗背景 */
        .overlay-box { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 500px; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(8px); border: 2px solid #3b82f6; border-radius: 16px; padding: 24px; color: white; z-index: 200; box-shadow: 0 20px 40px rgba(0,0,0,0.8); }
        
        /* 揮動動畫 */
        .swing { animation: swingAnim 0.2s ease-in-out; }
        @keyframes swingAnim { 0% { transform: rotate(0deg) translateY(0); } 50% { transform: rotate(-40deg) translateY(-30px) translateX(-20px); } 100% { transform: rotate(0deg) translateY(0); } }
    </style>
</head>
<body>

    <div id="crosshair">✚</div>
    <div id="msg-box">系統訊息</div>
    <div id="view-model">👊</div>
    <div id="luck-overlay">✨ 幸運增幅中！掉落增加！(<span id="luck-time"></span>s)</div>

    <div id="tutorial-overlay" class="overlay-box" style="display: block; border-color: #fbbf24;">
        <h2 class="text-2xl font-bold text-yellow-400 mb-4 border-b border-gray-600 pb-2">
            <i class="fas fa-gamepad"></i> 遊戲操作指南
        </h2>
        <div class="text-gray-200 text-base leading-relaxed space-y-3 mb-6">
            <p><strong class="text-blue-400">🛠️ 萬物皆可合成：</strong> 打開左上角「選單」，收集材料合成工具與食物。</p>
            <p><strong class="text-emerald-400">✨ 吃食物補血與增運：</strong> 點擊下方快捷列的食物可以直接吃！吃下「幸運金蘋果」可獲得 60 秒挖礦掉落加倍效果。</p>
            <p><strong class="text-red-400">⚠️ 食物不能挖礦：</strong> 食物太軟了，無法破壞方塊！請切換成「空手」或「鎬子」來採礦，用鎬子挖礦掉落會更多喔！</p>
            <p><strong class="text-purple-400">🎮 最佳化操控：</strong> 左搖桿移動，右搖桿轉視角（已調慢防暈），下方是物品欄，右方按鈕用來破壞或放置方塊。</p>
        </div>
        <button onclick="document.getElementById('tutorial-overlay').style.display='none'" class="px-6 py-3 bg-yellow-500 hover:bg-yellow-400 text-black font-bold rounded-lg w-full text-lg shadow-lg">
            我準備好出發了！
        </button>
    </div>

    <div class="status-ui">
        <div class="flex justify-between text-xs font-bold text-red-400 mb-1"><span>生命 HP</span><span id="hp-txt">100</span></div>
        <div class="stat-bar mb-2"><div id="hp-fill" class="hp-fill"></div></div>
        <div class="flex justify-between text-xs font-bold text-emerald-400 mb-1"><span>體力 Energy</span><span id="energy-txt">100</span></div>
        <div class="stat-bar"><div id="energy-fill" class="energy-fill"></div></div>
    </div>

    <button class="toggle-btn" onclick="document.getElementById('sidebar').classList.toggle('open'); renderUI();"><i class="fas fa-bars"></i> 選單合成</button>
    <div id="sidebar">
        <h2 class="text-xl font-bold mb-4"><i class="fas fa-cube text-blue-400"></i> 生存背包與合成</h2>
        <button onclick="document.getElementById('sidebar').classList.remove('open')" class="w-full bg-slate-700 p-2 rounded mb-4">關閉選單</button>
        
        <h3 class="text-sm text-gray-400 mb-2 border-b border-gray-600 pb-1">你的背包</h3>
        <div id="inventory-list" class="grid grid-cols-5 gap-2 mb-6"></div>

        <h3 class="text-sm text-gray-400 mb-2 border-b border-gray-600 pb-1">萬物合成台</h3>
        <div id="recipe-list" class="flex flex-col gap-2"></div>
    </div>

    <div id="hotbar"></div>

    <div id="controls">
        <button id="btn-place" class="action-btn" style="background: rgba(16, 185, 129, 0.4); border-color: #10b981;"><i class="fas fa-cube"></i></button>
        <button id="btn-break" class="action-btn" style="background: rgba(239, 68, 68, 0.4); border-color: #ef4444;"><i class="fas fa-hammer"></i></button>
    </div>

    <div id="joystick-move" class="joystick-zone"><div class="aim-label" style="color:#10b981;">移動</div><div class="joystick-knob" id="knob-move"></div></div>
    <div id="joystick-look" class="joystick-zone"><div class="aim-label" style="color:#ef4444;">視角</div><div class="joystick-knob" id="knob-look"></div></div>

    <script>
        // ==========================================
        // 1. 遊戲資料設定 (物品、食物、工具、配方)
        // ==========================================
        const ITEMS = {
            'wood': { name: '木頭', icon: '🪵', type: 'block' },
            'stone': { name: '石頭', icon: '🪨', type: 'block' },
            'dirt': { name: '泥土', icon: '🟤', type: 'block' },
            'stick': { name: '木棍', icon: '🦯', type: 'mat' },
            'apple': { name: '蘋果', icon: '🍎', type: 'food', energy: 10, hp: 5 },
            'meat': { name: '生肉', icon: '🥩', type: 'food', energy: 5, hp: 0 },
            'cooked_meat': { name: '烤肉', icon: '🍖', type: 'food', energy: 30, hp: 20 },
            'golden_apple': { name: '幸運金蘋果', icon: '✨', type: 'food', energy: 50, hp: 50, isLuck: true },
            'wood_pickaxe': { name: '木鎬', icon: '⛏️', type: 'tool' },
            'stone_pickaxe': { name: '石鎬', icon: '⛏️', type: 'tool' },
            'torch': { name: '火把', icon: '🔥', type: 'block' }
        };

        const RECIPES = [
            { id: 'stick', name: '木棍 x4', icon: '🦯', req: [{id:'wood', count:2}], outCount: 4 },
            { id: 'wood_pickaxe', name: '木鎬', icon: '⛏️', req: [{id:'wood', count:3}, {id:'stick', count:2}], outCount: 1 },
            { id: 'stone_pickaxe', name: '石鎬', icon: '⛏️', req: [{id:'stone', count:3}, {id:'stick', count:2}], outCount: 1 },
            { id: 'cooked_meat', name: '烤肉', icon: '🍖', req: [{id:'meat', count:1}, {id:'wood', count:1}], outCount: 1 },
            { id: 'golden_apple', name: '幸運蘋果', icon: '✨', req: [{id:'apple', count:1}, {id:'stone', count:5}], outCount: 1 } // 暫時用石頭代替金錠方便測試
        ];

        // 玩家資料
        let inventory = { 'wood': 10, 'stone': 5, 'apple': 3, 'meat': 2 }; 
        let hotbarSlots = ['wood', 'stone', 'apple', 'wood_pickaxe', '', ''];
        let selectedSlotIndex = 0;
        let hp = 100, energy = 100;
        let luckEndTime = 0;

        // ==========================================
        // 2. UI 更新與互動邏輯
        // ==========================================
        function showMsg(txt, color='#fbbf24') {
            const m = document.getElementById('msg-box');
            m.innerText = txt; m.style.color = color;
            m.style.opacity = 1;
            setTimeout(() => m.style.opacity = 0, 2000);
        }

        function updateStats(hpChange, energyChange) {
            hp = Math.max(0, Math.min(100, hp + hpChange));
            energy = Math.max(0, Math.min(100, energy + energyChange));
            document.getElementById('hp-fill').style.width = `${hp}%`;
            document.getElementById('hp-txt').innerText = Math.floor(hp);
            document.getElementById('energy-fill').style.width = `${energy}%`;
            document.getElementById('energy-txt').innerText = Math.floor(energy);
            if (hp <= 0) { showMsg("💀 你餓死/摔死了！", "red"); hp = 100; energy = 50; updateStats(0,0); }
        }

        // 吃東西邏輯
        function consumeItem(itemId) {
            const item = ITEMS[itemId];
            if (item && item.type === 'food' && inventory[itemId] > 0) {
                inventory[itemId]--;
                updateStats(item.hp, item.energy);
                showMsg(`😋 吃了 ${item.name}！`, '#10b981');
                
                // 幸運系統
                if (item.isLuck) {
                    luckEndTime = Date.now() + 60000; // 60秒
                    document.getElementById('luck-overlay').style.display = 'block';
                }
                
                if (inventory[itemId] <= 0) {
                    delete inventory[itemId];
                    hotbarSlots[selectedSlotIndex] = ''; // 清空該欄位
                }
                renderUI();
            }
        }

        function renderUI() {
            // 渲染背包
            const invDiv = document.getElementById('inventory-list'); invDiv.innerHTML = '';
            Object.keys(inventory).forEach(key => {
                if(inventory[key] > 0) {
                    const item = ITEMS[key];
                    invDiv.innerHTML += `<div class="slot bg-slate-800" title="${item.name}">${item.icon}<span class="slot-count">${inventory[key]}</span></div>`;
                }
            });

            // 渲染合成表
            const recDiv = document.getElementById('recipe-list'); recDiv.innerHTML = '';
            RECIPES.forEach(r => {
                const canCraft = r.req.every(req => (inventory[req.id] || 0) >= req.count);
                let reqHtml = r.req.map(req => `<span class="text-xs bg-black/40 px-1 rounded">${ITEMS[req.id].icon}x${req.count}</span>`).join(' ');
                recDiv.innerHTML += `
                    <div class="flex justify-between items-center p-2 rounded ${canCraft ? 'bg-blue-900/60' : 'bg-slate-800 opacity-50'}">
                        <div class="flex items-center gap-2"><span class="text-2xl">${r.icon}</span>
                        <div><div class="font-bold text-sm">${r.name} x${r.outCount}</div><div class="flex gap-1 mt-1">${reqHtml}</div></div></div>
                        <button onclick="craft('${r.id}')" class="px-3 py-1 bg-blue-600 rounded text-xs text-white ${!canCraft?'hidden':''}">合成</button>
                    </div>`;
            });

            // 渲染快捷列
            const hotbarDiv = document.getElementById('hotbar'); hotbarDiv.innerHTML = '';
            for(let i=0; i<6; i++) {
                const itemId = hotbarSlots[i];
                const count = itemId ? (inventory[itemId] || 0) : 0;
                const icon = itemId ? ITEMS[itemId].icon : '';
                
                // 如果快捷列上的東西沒了，就清空
                if (itemId && count <= 0) { hotbarSlots[i] = ''; }
                
                const div = document.createElement('div');
                div.className = `slot ${i === selectedSlotIndex ? 'active' : ''}`;
                div.innerHTML = `${icon}${count > 0 ? `<span class="slot-count">${count}</span>` : ''}`;
                
                div.onclick = () => {
                    selectedSlotIndex = i;
                    // 如果點擊的是食物，且已經是選中狀態，就直接吃掉！
                    if (itemId && ITEMS[itemId].type === 'food') {
                        consumeItem(itemId);
                    }
                    renderUI();
                };
                hotbarDiv.appendChild(div);
            }

            // 更新畫面手持物
            const currentItem = hotbarSlots[selectedSlotIndex];
            document.getElementById('view-model').innerText = currentItem && inventory[currentItem] > 0 ? ITEMS[currentItem].icon : '👊';
        }

        function craft(recipeId) {
            const r = RECIPES.find(x => x.id === recipeId);
            if(r.req.every(req => (inventory[req.id] || 0) >= req.count)) {
                r.req.forEach(req => inventory[req.id] -= req.count);
                inventory[r.id] = (inventory[r.id] || 0) + r.outCount;
                
                // 自動放入快捷列空位
                if(!hotbarSlots.includes(r.id)) {
                    const emptyIdx = hotbarSlots.findIndex(x => x === '');
                    if(emptyIdx !== -1) hotbarSlots[emptyIdx] = r.id;
                }
                showMsg(`🔨 合成了 ${r.name}`, '#3b82f6');
                renderUI();
            }
        }

        // ==========================================
        // 3. Three.js 場景與地形
        // ==========================================
        const scene = new THREE.Scene(); scene.fog = new THREE.FogExp2(0x87CEEB, 0.03);
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 100);
        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio > 1 ? 1.5 : 1); // 優化手機效能
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(10, 20, 10); scene.add(dirLight);

        // 簡單方塊材質
        function createColorMaterial(color) { return new THREE.MeshLambertMaterial({ color: color }); }
        const MATS = {
            'grass': createColorMaterial(0x55aa55),
            'dirt': createColorMaterial(0x8b5a2b),
            'stone': createColorMaterial(0x888888),
            'wood': createColorMaterial(0x5c4033)
        };
        const boxGeo = new THREE.BoxGeometry(1, 1, 1);

        // 地形生成 (Perlin Noise)
        const blocks = new Map();
        noise.seed(Math.random());
        
        function getBlockKey(x, y, z) { return `${Math.floor(x)},${Math.floor(y)},${Math.floor(z)}`; }
        
        function initTerrain() {
            const size = 10;
            for(let x = -size; x <= size; x++) {
                for(let z = -size; z <= size; z++) {
                    let h = Math.floor(noise.perlin2(x/15, z/15) * 4) + 2;
                    for(let y = -2; y <= h; y++) {
                        let type = y === h ? 'grass' : (y > h-2 ? 'dirt' : 'stone');
                        // 偶爾長樹
                        if (y === h && Math.random() < 0.05 && x !== 0 && z !== 0) {
                            addBlock(x, y+1, z, 'wood'); addBlock(x, y+2, z, 'wood');
                        }
                        addBlock(x, y, z, type);
                    }
                }
            }
        }

        function addBlock(x, y, z, type) {
            const mesh = new THREE.Mesh(boxGeo, MATS[type] || MATS['dirt']);
            mesh.position.set(x, y, z);
            scene.add(mesh);
            blocks.set(getBlockKey(x, y, z), { mesh, type });
        }

        initTerrain();
        camera.position.set(0, 5, 0);

        // ==========================================
        // 4. 破壞與放置邏輯 (包含防呆機制)
        // ==========================================
        const raycaster = new THREE.Raycaster();
        const center = new THREE.Vector2(0, 0);

        function swingHand() {
            const vm = document.getElementById('view-model');
            vm.classList.remove('swing');
            void vm.offsetWidth; // trigger reflow
            vm.classList.add('swing');
            updateStats(0, -1); // 扣體力
        }

        document.getElementById('btn-break').addEventListener('pointerdown', (e) => {
            e.preventDefault(); e.stopPropagation();
            
            const currentItemId = hotbarSlots[selectedSlotIndex];
            const currentItem = currentItemId ? ITEMS[currentItemId] : null;

            // ⛔ 物理防呆：如果手上拿的是食物，禁止挖礦！
            if (currentItem && currentItem.type === 'food') {
                showMsg("⚠️ 食物太軟了，無法用來挖礦！", "#ef4444");
                return; // 直接中斷
            }

            swingHand();
            raycaster.setFromCamera(center, camera);
            const intersects = raycaster.intersectObjects(scene.children).filter(i => i.object.geometry.type === 'BoxGeometry');
            
            if (intersects.length > 0 && intersects[0].distance < 5) {
                const target = intersects[0];
                const p = target.object.position;
                const key = getBlockKey(p.x, p.y, p.z);
                
                if (blocks.has(key)) {
                    const bType = blocks.get(key).type;
                    scene.remove(target.object);
                    blocks.delete(key);

                    // ✨ 計算掉落數量 (基礎 1 + 工具加成 + 幸運加成)
                    let dropCount = 1;
                    let isLuckActive = Date.now() < luckEndTime;
                    
                    if (currentItem && currentItem.type === 'tool') dropCount += 1; // 拿鎬子挖 +1
                    if (isLuckActive) dropCount += 1; // 幸運增幅 +1

                    // 轉換掉落物名稱
                    let dropId = bType === 'grass' ? 'dirt' : bType; 
                    if(dropId === 'wood' && Math.random() < 0.3) inventory['apple'] = (inventory['apple']||0) + 1; // 砍樹掉蘋果
                    
                    inventory[dropId] = (inventory[dropId] || 0) + dropCount;
                    
                    let msg = `⛏️ 獲得 ${ITEMS[dropId].name} x${dropCount}`;
                    if(isLuckActive) msg += " (✨幸運加成)";
                    showMsg(msg, isLuckActive ? '#fbbf24' : '#ffffff');
                    
                    renderUI();
                }
            }
        });

        document.getElementById('btn-place').addEventListener('pointerdown', (e) => {
            e.preventDefault(); e.stopPropagation();
            const currentItemId = hotbarSlots[selectedSlotIndex];
            const currentItem = currentItemId ? ITEMS[currentItemId] : null;

            // 必須是 block 類型才能放置，且數量大於0
            if (!currentItem || currentItem.type !== 'block' || !(inventory[currentItemId] > 0)) {
                return;
            }

            swingHand();
            raycaster.setFromCamera(center, camera);
            const intersects = raycaster.intersectObjects(scene.children).filter(i => i.object.geometry.type === 'BoxGeometry');
            
            if (intersects.length > 0 && intersects[0].distance < 5) {
                const p = intersects[0].object.position.clone().add(intersects[0].face.normal);
                const key = getBlockKey(p.x, p.y, p.z);
                
                if (!blocks.has(key)) {
                    addBlock(p.x, p.y, p.z, currentItemId === 'dirt' ? 'dirt' : currentItemId);
                    inventory[currentItemId]--;
                    if(inventory[currentItemId] <= 0) hotbarSlots[selectedSlotIndex] = ''; // 用光清空
                    renderUI();
                }
            }
        });

        // ==========================================
        // 5. 虛擬搖桿與移動控制 (完美防遮擋 & 滑順)
        // ==========================================
        let moveInput = { x: 0, y: 0 };
        let lookInput = { x: 0, y: 0 };

        function setupJoystick(zoneId, knobId, outputObj) {
            const zone = document.getElementById(zoneId);
            const knob = document.getElementById(knobId);
            let activeId = null;
            let centerX, centerY, maxR = 40;

            zone.addEventListener('touchstart', e => {
                e.preventDefault(); e.stopPropagation();
                const touch = e.changedTouches[0];
                activeId = touch.identifier;
                const rect = zone.getBoundingClientRect();
                centerX = rect.left + rect.width / 2;
                centerY = rect.top + rect.height / 2;
                updateKnob(touch.clientX, touch.clientY);
            }, {passive: false});

            zone.addEventListener('touchmove', e => {
                e.preventDefault(); e.stopPropagation();
                for(let i=0; i<e.changedTouches.length; i++) {
                    if(e.changedTouches[i].identifier === activeId) {
                        updateKnob(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
                        break;
                    }
                }
            }, {passive: false});

            const endDrag = (e) => {
                for(let i=0; i<e.changedTouches.length; i++) {
                    if(e.changedTouches[i].identifier === activeId) {
                        activeId = null;
                        knob.style.transform = `translate(0px, 0px)`;
                        outputObj.x = 0; outputObj.y = 0;
                        break;
                    }
                }
            };
            zone.addEventListener('touchend', endDrag);
            zone.addEventListener('touchcancel', endDrag);

            function updateKnob(tx, ty) {
                let dx = tx - centerX; let dy = ty - centerY;
                let dist = Math.sqrt(dx*dx + dy*dy);
                if (dist > maxR) { dx = (dx/dist)*maxR; dy = (dy/dist)*maxR; }
                knob.style.transform = `translate(${dx}px, ${dy}px)`;
                outputObj.x = dx / maxR;
                outputObj.y = dy / maxR;
            }
        }

        setupJoystick('joystick-move', 'knob-move', moveInput);
        setupJoystick('joystick-look', 'knob-look', lookInput);

        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        let euler = new THREE.Euler(0, 0, 0, 'YXZ');

        function updateGame() {
            requestAnimationFrame(updateGame);

            // 🐌 視角滑順轉動：靈敏度設定為 0.04 (非常穩定)
            if (lookInput.x !== 0 || lookInput.y !== 0) {
                const lookSpeed = 0.04; 
                euler.setFromQuaternion(camera.quaternion);
                euler.y -= lookInput.x * lookSpeed;
                euler.x -= lookInput.y * lookSpeed;
                euler.x = Math.max(-Math.PI/2 + 0.1, Math.min(Math.PI/2 - 0.1, euler.x)); // 限制上下看
                camera.quaternion.setFromEuler(euler);
            }

            // 移動計算
            if (moveInput.x !== 0 || moveInput.y !== 0) {
                const moveSpeed = 0.15;
                direction.set(moveInput.x, 0, moveInput.y);
                
                // 根據相機目前的Y軸旋轉來移動 (前進是朝向視角方向)
                const camRotY = euler.y; 
                direction.applyAxisAngle(new THREE.Vector3(0,1,0), camRotY);
                
                camera.position.addScaledVector(direction, moveSpeed);
            }

            // 更新幸運UI
            if (luckEndTime > 0) {
                let remain = Math.ceil((luckEndTime - Date.now()) / 1000);
                if (remain > 0) {
                    document.getElementById('luck-time').innerText = remain;
                } else {
                    luckEndTime = 0;
                    document.getElementById('luck-overlay').style.display = 'none';
                    showMsg("幸運效果結束了", "#aaaaaa");
                }
            }

            renderer.render(scene, camera);
        }

        // 初始化
        window.onload = () => {
            renderUI();
            updateGame();
        };

        // 處理螢幕縮放
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
