<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D 理化生存世界 - 準心瞄準與流暢生態版</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="1-1ce8683e.ico"> 
    <script src="mockdata/users.js"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: 'Noto Sans TC', sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; background-color: #87CEEB; }
        
        /* UI 元素 */
        #crosshair-container { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10; pointer-events: none; text-align: center; }
        #crosshair { color: rgba(255,255,255,0.8); font-size: 24px; text-shadow: 0 0 3px black; transition: transform 0.1s, color 0.1s; }
        #target-info { color: white; font-size: 12px; margin-top: 5px; text-shadow: 1px 1px 2px black; opacity: 0; transition: opacity 0.2s; }
        
        #msg-box { position: fixed; top: 15%; left: 50%; transform: translateX(-50%); font-size: 20px; font-weight: bold; color: #fbbf24; text-shadow: 2px 2px 4px black; z-index: 100; opacity: 0; transition: opacity 0.3s; pointer-events: none; width: 100%; text-align: center; }
        #view-model { position: fixed; bottom: -30px; right: 15%; font-size: 120px; z-index: 15; transform-origin: bottom right; transition: transform 0.1s; pointer-events: none; filter: drop-shadow(0px 10px 10px rgba(0,0,0,0.5)); }
        
        /* 狀態條 */
        .status-ui { position: fixed; top: 15px; right: 15px; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 12px; color: white; z-index: 20; min-width: 140px; pointer-events: none; backdrop-filter: blur(4px); }
        .stat-bar { width: 100%; height: 10px; background: #333; border-radius: 5px; margin-top: 3px; overflow: hidden; border: 1px solid #555; }
        .hp-fill { height: 100%; background: #ef4444; width: 100%; transition: width 0.3s; }
        .energy-fill { height: 100%; background: #10b981; width: 100%; transition: width 0.3s; }

        /* 左側選單 */
        .toggle-btn { position: fixed; top: 15px; left: 15px; z-index: 60; background: rgba(0,0,0,0.6); color: white; padding: 10px 15px; border-radius: 8px; cursor: pointer; backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.2); pointer-events: auto; }
        #sidebar { position: fixed; top: 0; left: -350px; width: 350px; height: 100vh; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); z-index: 50; transition: left 0.3s; color: white; padding: 20px; overflow-y: auto; border-right: 2px solid rgba(255,255,255,0.1); }
        #sidebar.open { left: 0; }
        #inventory-list, #recipe-list { max-height: 300px; overflow-y: auto; }

        /* 🚀 快捷列 (Hotbar)：支援滑動瀏覽 */
        #hotbar-container { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); z-index: 40; pointer-events: auto; }
        #hotbar { display: flex; gap: 6px; background: rgba(0,0,0,0.7); padding: 8px; border-radius: 16px; backdrop-filter: blur(4px); overflow-x: auto; max-width: 90vw; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
        #hotbar::-webkit-scrollbar { display: none; } /* 隱藏捲動條 */
        
        .slot { flex: 0 0 45px; width: 45px; height: 45px; border: 2px solid #555; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 24px; color: white; position: relative; cursor: pointer; background: rgba(255,255,255,0.1); transition: transform 0.1s, border-color: 0.1s; }
        .slot.active { border-color: #fbbf24; background: rgba(251, 191, 36, 0.3); box-shadow: 0 0 15px rgba(251,191,36,0.8); transform: scale(1.1); }
        .slot-count { position: absolute; bottom: 2px; right: 4px; font-size: 11px; font-weight: bold; text-shadow: 1px 1px 2px black; }

        /* 搖桿區 */
        .joystick-zone { position: fixed; bottom: 120px; width: 120px; height: 120px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; z-index: 30; backdrop-filter: blur(4px); pointer-events: auto; }
        #joystick-move { left: 25px; }
        #joystick-look { right: 25px; background: rgba(255,100,100,0.1); border-color: rgba(255,100,100,0.3); }
        .joystick-knob { position: absolute; top: 37.5px; left: 37.5px; width: 45px; height: 45px; background: rgba(255,255,255,0.8); border-radius: 50%; pointer-events: none; }
        #joystick-look .joystick-knob { background: rgba(255,100,100,0.8); }

        /* 互動按鈕 */
        #controls { position: fixed; bottom: 260px; right: 25px; z-index: 30; display: flex; flex-direction: column; gap: 12px; pointer-events: auto; }
        .action-btn { width: 55px; height: 55px; border-radius: 50%; background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.5); color: white; display: flex; align-items: center; justify-content: center; font-size: 22px; backdrop-filter: blur(4px); }

        /* 彈窗 */
        .overlay-box { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 450px; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(8px); border: 2px solid #3b82f6; border-radius: 16px; padding: 20px; color: white; z-index: 200; box-shadow: 0 20px 40px rgba(0,0,0,0.8); max-height: 80vh; overflow-y: auto; }
        .quiz-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); padding: 10px; margin: 6px 0; border-radius: 8px; cursor: pointer; width: 100%; text-align: left; color: white; font-size: 15px; transition: 0.2s; }
        .quiz-btn:hover { background: rgba(59, 130, 246, 0.5); border-color: #3b82f6; }
        
        /* 揮動動畫 */
        .swing { animation: swingAnim 0.2s ease-in-out; }
        @keyframes swingAnim { 0% { transform: rotate(0deg) translateY(0); } 50% { transform: rotate(-40deg) translateY(-30px) translateX(-20px); } 100% { transform: rotate(0deg) translateY(0); } }
    </style>
</head>
<body>

    <div id="crosshair-container">
        <div id="crosshair">✚</div>
        <div id="target-info">瞄準中...</div>
    </div>
    
    <div id="msg-box">系統訊息</div>
    <div id="view-model">👊</div>
    <div id="luck-overlay">✨ 幸運增幅中！(<span id="luck-time"></span>s)</div>

    <div class="status-ui">
        <div class="flex justify-between text-xs font-bold text-red-400 mb-1"><span>生命 HP</span><span id="hp-txt">100</span></div>
        <div class="stat-bar mb-2"><div id="hp-fill" class="hp-fill"></div></div>
        <div class="flex justify-between text-xs font-bold text-emerald-400 mb-1"><span>體力 Energy</span><span id="energy-txt">100</span></div>
        <div class="stat-bar"><div id="energy-fill" class="energy-fill"></div></div>
    </div>

    <button class="toggle-btn" onclick="document.getElementById('sidebar').classList.toggle('open'); renderUI();"><i class="fas fa-bars"></i> 選單合成</button>
    <div id="sidebar">
        <h2 class="text-xl font-bold mb-4"><i class="fas fa-cube text-blue-400"></i> 生存背包與合成</h2>
        <button onclick="document.getElementById('sidebar').classList.remove('open')" class="w-full bg-slate-700 p-2 rounded mb-4">關閉選單</button>
        <div id="inventory-list" class="grid grid-cols-5 gap-2 mb-6"></div>
        <div id="recipe-list" class="flex flex-col gap-2"></div>
    </div>

    <div id="boss-quiz-overlay" class="overlay-box" style="border-color: #ef4444;">
        <h2 class="text-2xl font-bold text-red-400 mb-4 border-b border-gray-600 pb-2"><i class="fas fa-skull"></i> 魔王的挑戰！</h2>
        <div id="boss-question" class="text-gray-200 text-lg mb-6 leading-relaxed">題目載入中...</div>
        <div id="boss-options" class="space-y-3"></div>
        <div class="mt-6 text-right"><button onclick="closeBossQuiz()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded">逃跑 (-20 體力)</button></div>
    </div>

    <div id="hotbar-container">
        <div id="hotbar">
            </div>
    </div>

    <div id="controls">
        <button id="btn-interact" class="action-btn" style="background: rgba(59, 130, 246, 0.4); border-color: #3b82f6;"><i class="fas fa-hand-pointer"></i></button>
        <button id="btn-place" class="action-btn" style="background: rgba(16, 185, 129, 0.4); border-color: #10b981;"><i class="fas fa-cube"></i></button>
        <button id="btn-break" class="action-btn" style="background: rgba(239, 68, 68, 0.4); border-color: #ef4444;"><i class="fas fa-hammer"></i></button>
    </div>

    <div id="joystick-move" class="joystick-zone"><div class="joystick-knob" id="knob-move"></div></div>
    <div id="joystick-look" class="joystick-zone"><div class="joystick-knob" id="knob-look"></div></div>

    <script>
        // ==========================================
        // 1. 遊戲資料設定 (物品、食物、工具、配方)
        // ==========================================
        const ITEMS = {
            'wood': { name: '木頭', icon: '🪵', type: 'block' }, 'stone': { name: '石頭', icon: '🪨', type: 'block' }, 'dirt': { name: '泥土', icon: '🟤', type: 'block' },
            'stick': { name: '木棍', icon: '🦯', type: 'mat' }, 'apple': { name: '蘋果', icon: '🍎', type: 'food', energy: 15, hp: 10 },
            'meat': { name: '生肉', icon: '🥩', type: 'food', energy: 5, hp: 0 }, 'cooked_meat': { name: '烤肉', icon: '🍖', type: 'food', energy: 40, hp: 30 },
            'golden_apple': { name: '幸運金蘋果', icon: '✨', type: 'food', energy: 80, hp: 80, isLuck: true },
            'diamond': { name: '鑽石', icon: '💎', type: 'mat' }, 'wood_pickaxe': { name: '木鎬', icon: '⛏️', type: 'tool' },
            'stone_pickaxe': { name: '石鎬', icon: '⛏️', type: 'tool' }, 'torch': { name: '火把', icon: '🔥', type: 'block' },
            // 多一些材料供滑動測試
            'iron_ore': { name: '鐵礦', icon: '⚪', type: 'mat' }, 'coal': { name: '煤炭', icon: '⚫', type: 'mat' }, 'string': { name: '線', icon: '🧶', type: 'mat' }
        };

        const RECIPES = [
            { id: 'stick', name: '木棍 x4', icon: '🦯', req: [{id:'wood', count:2}], outCount: 4 },
            { id: 'wood_pickaxe', name: '木鎬', icon: '⛏️', req: [{id:'wood', count:3}, {id:'stick', count:2}], outCount: 1 },
            { id: 'stone_pickaxe', name: '石鎬', icon: '⛏️', req: [{id:'stone', count:3}, {id:'stick', count:2}], outCount: 1 },
            { id: 'cooked_meat', name: '烤肉', icon: '🍖', req: [{id:'meat', count:1}, {id:'wood', count:1}], outCount: 1 },
            { id: 'golden_apple', name: '幸運蘋果', icon: '✨', req: [{id:'apple', count:1}, {id:'diamond', count:1}], outCount: 1 }
        ];

        // 玩家資料
        let inventory = { 'wood': 20, 'stone': 10, 'apple': 5, 'wood_pickaxe': 1, 'dirt': 5, 'iron_ore': 2, 'coal': 3 }; 
        let hotbarSlots = ['wood', 'stone', 'apple', 'wood_pickaxe', 'dirt', 'iron_ore', 'coal']; // 超過6個
        let selectedSlotIndex = 0;
        let hp = 100, energy = 100, luckEndTime = 0;

        // 魔王題目 (保底)
        let bossQuestions = [{ question: "國八理化：冰融化是？變化", options: ["物理", "化學", "生物", "心理"], answer: 0 }];
        let currentBossQ = null;

        // ==========================================
        // 2. UI 更新與互動邏輯
        // ==========================================
        function showMsg(txt, color='#fbbf24') { const m = document.getElementById('msg-box'); m.innerText = txt; m.style.color = color; m.style.opacity = 1; setTimeout(() => m.style.opacity = 0, 2000); }
        function updateStats(hpChange, energyChange) { hp = Math.max(0, Math.min(100, hp + hpChange)); energy = Math.max(0, Math.min(100, energy + energyChange)); document.getElementById('hp-fill').style.width = `${hp}%`; document.getElementById('hp-txt').innerText = Math.floor(hp); document.getElementById('energy-fill').style.width = `${energy}%`; document.getElementById('energy-txt').innerText = Math.floor(energy); if (hp <= 0) { showMsg("💀 你餓死/摔死了！", "red"); resetPlayer(); } }
        function resetPlayer() { camera.position.set(0, 5, 0); hp = 100; energy = 100; updateStats(0,0); }
        function consumeItem(itemId) { const item = ITEMS[itemId]; if (item && item.type === 'food' && inventory[itemId] > 0) { inventory[itemId]--; updateStats(item.hp, item.energy); showMsg(`😋 吃了 ${item.name}！`, '#10b981'); if (item.isLuck) { luckEndTime = Date.now() + 60000; document.getElementById('luck-overlay').style.display = 'block'; } if (inventory[itemId] <= 0) { delete inventory[itemId]; } renderUI(); } }

        // 🎒 🚀 終極修復：滑動快捷列 (Hotbar)
        function renderUI() {
            // 背包
            const invDiv = document.getElementById('inventory-list'); invDiv.innerHTML = '';
            Object.keys(inventory).forEach(key => { if(inventory[key] > 0) { const item = ITEMS[key]; invDiv.innerHTML += `<div class="slot bg-slate-800">${item.icon}<span class="slot-count">${inventory[key]}</span></div>`; } });

            // 合成表
            const recDiv = document.getElementById('recipe-list'); recDiv.innerHTML = '';
            RECIPES.forEach(r => { const canCraft = r.req.every(req => (inventory[req.id] || 0) >= req.count); recDiv.innerHTML += `<div class="flex justify-between items-center p-2 rounded ${canCraft ? 'bg-blue-900/60' : 'bg-slate-800 opacity-50'}"><div class="flex items-center gap-2"><span class="text-2xl">${r.icon}</span><div><div class="font-bold text-sm">${r.name}</div></div></div><button onclick="craft('${r.id}')" class="px-3 py-1 bg-blue-600 rounded text-xs text-white ${!canCraft?'hidden':''}">合成</button></div>`; });

            // 🚀 快捷列 (支援滑動與自動對齊)
            const hotbarDiv = document.getElementById('hotbar'); hotbarDiv.innerHTML = '';
            
            // 整理快捷列 (移除數量為0的物品)
            hotbarSlots = hotbarSlots.filter(id => id && inventory[id] > 0);
            if(selectedSlotIndex >= hotbarSlots.length) selectedSlotIndex = 0;

            hotbarSlots.forEach((itemId, i) => {
                const count = inventory[itemId]; const icon = ITEMS[itemId].icon;
                const div = document.createElement('div');
                div.className = `slot ${i === selectedSlotIndex ? 'active' : ''}`;
                div.innerHTML = `${icon}<span class="slot-count">${count}</span>`;
                div.onclick = (e) => {
                    if (selectedSlotIndex === i && ITEMS[itemId].type === 'food') { consumeItem(itemId); }
                    else { selectedSlotIndex = i; }
                    renderUI();
                    e.target.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' }); // 自動選中對齊
                };
                hotbarDiv.appendChild(div);
            });
            
            // 更新手持物
            const currentItem = hotbarSlots[selectedSlotIndex];
            document.getElementById('view-model').innerText = currentItem ? ITEMS[currentItem].icon : '👊';
        }

        // ==========================================
        // 3. 大魔王系統 與 準心瞄準
        // ==========================================
        let isBossQuizOpen = false;
        function openBossQuiz() { if (isBossQuizOpen || energy < 20) return; isBossQuizOpen = true; document.getElementById('boss-quiz-overlay').style.display = 'block'; currentBossQ = bossQuestions[0]; document.getElementById('boss-question').innerHTML = currentBossQ.question; const optionsDiv = document.getElementById('boss-options'); optionsDiv.innerHTML = ''; currentBossQ.options.forEach((opt, idx) => { const btn = document.createElement('button'); btn.className = "quiz-btn w-full text-left p-3 rounded-lg bg-slate-800"; btn.innerHTML = `${String.fromCharCode(65+idx)}. ${opt}`; btn.onclick = () => checkBossAnswer(idx); optionsDiv.appendChild(btn); }); }
        function checkBossAnswer(selectedIdx) { if (selectedIdx === currentBossQ.answer) { showMsg("🎉 擊敗了大魔王！", "#10b981"); inventory['golden_apple'] = (inventory['golden_apple'] || 0) + 1; inventory['diamond'] = (inventory['diamond'] || 0) + 3; setTimeout(() => { removeBoss(); closeBossQuiz(true); renderUI(); }, 1500); } else { showMsg("💥 答錯了！受到懲罰！", "red"); updateStats(-30, -10); setTimeout(() => closeBossQuiz(false), 1500); } }
        function closeBossQuiz(isVictory = false) { document.getElementById('boss-quiz-overlay').style.display = 'none'; isBossQuizOpen = false; if(!isVictory) updateStats(0, -10); }

        // 🎯 🚀 終極修復：動態準心與目標移動監測
        const raycaster = new THREE.Raycaster(); const center = new THREE.Vector2(0, 0);

        function updateCrosshairSystem() {
            raycaster.setFromCamera(center, camera);
            
            // 檢測所有物體 (方塊與動物群)
            const allTargets = [ ...scene.children.filter(obj => obj.geometry && obj.geometry.type === 'BoxGeometry'), ...entities.map(e => e.group) ];
            const intersects = raycaster.intersectObjects(allTargets, true);
            
            const crosshairEl = document.getElementById('crosshair'); const targetInfoEl = document.getElementById('target-info');

            if (intersects.length > 0 && intersects[0].distance < 12) {
                const target = intersects[0].object; const dist = Math.floor(intersects[0].distance);
                crosshairEl.style.transform = 'scale(1.3)'; // 放大準心
                targetInfoEl.style.opacity = '1';

                // 辨識目標
                if (target.parent && target.parent.userData.type) { // 是動物
                    const type = target.parent.userData.type;
                    crosshairEl.style.color = '#fbbf24'; // 變黃
                    targetInfoEl.innerText = `${type === 'pig' ? '🐷' : '🐮'} 動物 (${dist}m)`;
                } else if (target.userData.type === 'boss') { // 是魔王
                    crosshairEl.style.color = '#ef4444'; // 變紅
                    targetInfoEl.innerText = `👹 理化大魔王 (${dist}m)`;
                } else { // 是方塊
                    crosshairEl.style.color = 'rgba(255,255,255,0.9)'; // 變白
                    const bType = target.userData.blockType;
                    targetInfoEl.innerText = `🧱 ${ITEMS[bType] ? ITEMS[bType].name : '方塊'} (${dist}m)`;
                }
            } else {
                // 瞄準空白
                crosshairEl.style.transform = 'scale(1)'; crosshairEl.style.color = 'rgba(255,255,255,0.8)'; targetInfoEl.style.opacity = '0';
            }
        }

        // ==========================================
        // 4. Three.js: 地形、動物 AI 與跳躍
        // ==========================================
        const scene = new THREE.Scene(); scene.fog = new THREE.FogExp2(0x87CEEB, 0.05);
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 100);
        const renderer = new THREE.WebGLRenderer({ antialias: false }); renderer.setSize(window.innerWidth, window.innerHeight); renderer.setPixelRatio(window.devicePixelRatio > 1 ? 1.5 : 1); document.body.appendChild(renderer.domElement);
        scene.add(new THREE.AmbientLight(0xffffff, 0.8)); const dirLight = new THREE.DirectionalLight(0xffffff, 0.5); dirLight.position.set(10, 20, 10); scene.add(dirLight);

        const MATS = { 'grass': createColorMaterial(0x55aa55), 'dirt': createColorMaterial(0x8b5a2b), 'stone': createColorMaterial(0x888888), 'wood': createColorMaterial(0x5c4033), 'leaves': createColorMaterial(0x228b22), 'pig': createColorMaterial(0xffc0cb), 'cow': createColorMaterial(0x7f4c1e), 'boss': createColorMaterial(0xef4444) };
        function createColorMaterial(color) { return new THREE.MeshLambertMaterial({ color: color }); }
        const boxGeo = new THREE.BoxGeometry(1, 1, 1);

        const blocks = new Map(); const entities = []; let bossEntity = null; noise.seed(Math.random());
        function addBlock(x, y, z, type) { const mesh = new THREE.Mesh(boxGeo, MATS[type] || MATS['dirt']); mesh.position.set(x, y, z); mesh.userData.blockType = type; scene.add(mesh); blocks.set(`${Math.floor(x)},${Math.floor(y)},${Math.floor(z)}`, { mesh, type }); }
        function spawnTree(x, z) { let baseH = Math.floor(noise.perlin2(x/15, z/15) * 4) + 2; for(let y=baseH+1; y<=baseH+4; y++) addBlock(x, y, z, 'wood'); for(let ox=-1; ox<=1; ox++) for(let oz=-1; oz<=1; oz++) addBlock(x+ox, baseH+4, z+oz, 'leaves'); }

        // 🐖🐄 動態生物 (流暢 AI 與自動跳躍)
        function spawnAnimal(type) {
            const group = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.6, 1.2), MATS[type]); body.position.y = 0.6; group.add(body);
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), MATS[type]); head.position.set(0, 0.8, -0.7); group.add(head);
            group.position.set((Math.random()-0.5)*30, 5, (Math.random()-0.5)*30);
            group.userData = { type, id: entities.length, velY: 0, isJumping: false }; scene.add(group);
            entities.push({ group, velocity: new THREE.Vector3(0, 0, 0), nextStateTime: 0, state: 'idle' });
        }

        function removeBoss() { if(bossEntity) { scene.remove(bossEntity); bossEntity = null; } }

        const generatedChunks = new Set(); const CHUNK_SIZE = 8;
        function updateInfiniteTerrain() { const px = Math.floor(camera.position.x / CHUNK_SIZE); const pz = Math.floor(camera.position.z / CHUNK_SIZE); const viewDist = 2; for (let x = px - viewDist; x <= px + viewDist; x++) for (let z = pz - viewDist; z <= pz + viewDist; z++) { if (!generatedChunks.has(`${x},${z}`)) { generateChunk(x, z); generatedChunks.add(`${x},${z}`); } } }
        function generateChunk(cx, cz) { for (let x = 0; x < CHUNK_SIZE; x++) for (let z = 0; z < CHUNK_SIZE; z++) { const wx = cx * CHUNK_SIZE + x; const wz = cz * CHUNK_SIZE + z; let h = Math.floor(noise.perlin2(wx/15, wz/15) * 4) + 2; for(let y = -1; y <= h; y++) addBlock(wx, y, wz, y === h ? 'grass' : (y > h-2 ? 'dirt' : 'stone')); if (wx !== 0 && wz !== 0 && Math.random() < 0.03) spawnTree(wx, wz); } }

        updateInfiniteTerrain(); camera.position.set(0, 5, 0);

        // 🚀 🌱 動物多一點 (但不要太多)：增加到 30 隻
        for(let i=0; i<18; i++) spawnAnimal('pig');
        for(let i=0; i<12; i++) spawnAnimal('cow');
        bossEntity = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), MATS['boss']); bossEntity.position.set(0, 10, 0); bossEntity.userData.type = 'boss'; scene.add(bossEntity);

        // ==========================================
        // 5. 互動與 6. 移動系統
        // ==========================================
        let moveInput = { x: 0, y: 0 }; let lookInput = { x: 0, y: 0 }; const keysPressed = {};
        document.addEventListener('keydown', e => { keysPressed[e.key.toLowerCase()] = true; if(['1','2','3','4','5','6','7','8'].includes(e.key)) { selectedSlotIndex = parseInt(e.key) - 1; if(selectedSlotIndex < hotbarSlots.length) renderUI(); document.querySelector(`.slot:nth-child(${selectedSlotIndex+1})`).scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' }); } });
        document.addEventListener('keyup', e => keysPressed[e.key.toLowerCase()] = false);
        // PC 滾輪滑動快捷列
        document.addEventListener('wheel', (e) => { if(isBossQuizOpen) return; selectedSlotIndex = (selectedSlotIndex + (e.deltaY > 0 ? 1 : -1) + hotbarSlots.length) % hotbarSlots.length; renderUI(); document.querySelector('.slot.active').scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' }); });

        function setupJoystick(zoneId, knobId, outputObj) { const zone = document.getElementById(zoneId); const knob = document.getElementById(knobId); let activeId = null; let centerX, centerY, maxR = 40; zone.addEventListener('touchstart', e => { e.preventDefault(); const touch = e.changedTouches[0]; activeId = touch.identifier; const rect = zone.getBoundingClientRect(); centerX = rect.left + rect.width / 2; centerY = rect.top + rect.height / 2; updateKnob(touch.clientX, touch.clientY); }, {passive: false}); zone.addEventListener('touchmove', e => { e.preventDefault(); for(let i=0; i<e.changedTouches.length; i++) if(e.changedTouches[i].identifier === activeId) { updateKnob(e.changedTouches[i].clientX, e.changedTouches[i].clientY); break; } }, {passive: false}); zone.addEventListener('touchend', e => { for(let i=0; i<e.changedTouches.length; i++) if(e.changedTouches[i].identifier === activeId) { activeId = null; knob.style.transform = `translate(0px, 0px)`; outputObj.x = 0; outputObj.y = 0; break; } }); function updateKnob(tx, ty) { let dx = tx - centerX; let dy = ty - centerY; let dist = Math.sqrt(dx*dx + dy*dy); if (dist > maxR) { dx = (dx/dist)*maxR; dy = (dy/dist)*maxR; } knob.style.transform = `translate(${dx}px, ${dy}px)`; outputObj.x = dx / maxR; outputObj.y = dy / maxR; } }
        setupJoystick('joystick-move', 'knob-move', moveInput); setupJoystick('joystick-look', 'knob-look', lookInput);

        const direction = new THREE.Vector3(); let euler = new THREE.Euler(0, 0, 0, 'YXZ'); let playerVelocityY = 0; const clock = new THREE.Clock();

        function updateGame() {
            requestAnimationFrame(updateGame); const delta = clock.getDelta(); const time = Date.now();
            if(isBossQuizOpen) { renderer.render(scene, camera); return; }

            // 1. 視角
            euler.setFromQuaternion(camera.quaternion); euler.y -= lookInput.x * 0.04; euler.x -= lookInput.y * 0.04; euler.x = Math.max(-1.5, Math.min(1.5, euler.x)); camera.quaternion.setFromEuler(euler);

            // 2. 玩家移動
            let inputX = moveInput.x; let inputZ = moveInput.y;
            if(keysPressed['w']) inputZ = -1; if(keysPressed['s']) inputZ = 1; if(keysPressed['a']) inputX = -1; if(keysPressed['d']) inputX = 1;
            if (inputX !== 0 || inputZ !== 0) { direction.set(inputX, 0, inputZ).normalize(); direction.applyAxisAngle(new THREE.Vector3(0,1,0), euler.y); camera.position.addScaledVector(direction, 0.15); updateInfiniteTerrain(); }

            // 3. ✨ 重力 與 準心瞄準
            playerVelocityY = blocks.has(`${Math.floor(camera.position.x)},${Math.floor(camera.position.y - 1.8)},${Math.floor(camera.position.z)}`) ? 0 : playerVelocityY - 0.01;
            camera.position.y += playerVelocityY; if(camera.position.y < -10) resetPlayer();
            updateCrosshairSystem();

            // 4. 🐖🐄 🌱 終極生物 AI 與自動跳躍 (流暢化)
            entities.forEach(ent => {
                const group = ent.group; const data = group.userData;

                if (time > ent.nextStateTime) {
                    // 隨機切換狀態：idle (發呆), wander (遊蕩), run (小跑)
                    const rnd = Math.random();
                    if(rnd < 0.4) { ent.state = 'idle'; ent.velocity.set(0,0,0); ent.nextStateTime = time + 2000 + Math.random()*2000; }
                    else if(rnd < 0.8) { ent.state = 'wander'; group.rotation.y = Math.random()*Math.PI*2; ent.velocity.set(0, 0, -0.02).applyAxisAngle(new THREE.Vector3(0,1,0), group.rotation.y); ent.nextStateTime = time + 3000 + Math.random()*3000; }
                    else { ent.state = 'run'; group.rotation.y = Math.random()*Math.PI*2; ent.velocity.set(0, 0, -0.05).applyAxisAngle(new THREE.Vector3(0,1,0), group.rotation.y); ent.nextStateTime = time + 1000 + Math.random()*2000; }
                }
                
                // 移動與跳躍偵測
                if(ent.state !== 'idle') {
                    const nextPos = group.position.clone().add(ent.velocity);
                    
                    // 🚀 關鍵修復：自動跳躍 AI (遇到障礙物時)
                    const blockInFrontKey = `${Math.floor(nextPos.x)},${Math.floor(group.position.y)},${Math.floor(nextPos.z)}`;
                    if(blocks.has(blockInFrontKey) && !data.isJumping) {
                        data.velY = 0.15; // 跳躍力
                        data.isJumping = true;
                    }
                    group.position.add(ent.velocity);
                }

                // 生物重力
                const entFeetKey = `${Math.floor(group.position.x)},${Math.floor(group.position.y - 0.1)},${Math.floor(group.position.z)}`;
                if (!blocks.has(entFeetKey)) {
                    data.velY -= 0.01;
                } else {
                    if(data.isJumping && data.velY <= 0) data.isJumping = false;
                    data.velY = Math.max(0, data.velY);
                }
                group.position.y += data.velY;
            });

            // 魔王視覺
            if(bossEntity) bossEntity.rotation.y += 0.01;

            renderer.render(scene, camera);
        }

        window.onload = () => { renderUI(); updateGame(); showMsg("🌲 生存 Start! 瞄準動物說🐷牛🐮", "#ffffff"); };
        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
    </script>
</body>
</html>
