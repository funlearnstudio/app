<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D 生存學習世界 - 地形與系統完全體</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/gh/josephg/noisejs/perlin.js"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="mockdata/users.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/generator_engine.js"></script>
    <script src="mockdata/generator_engine_polyfill.js"></script>
    <script src="mockdata/paper_generator.js"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: 'Noto Sans TC', sans-serif; touch-action: none; user-select: none; }
        
        /* 側邊欄與UI */
        #sidebar { position: fixed; top: 0; left: -350px; width: 350px; height: 100vh; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); z-index: 50; transition: left 0.3s; color: white; padding: 20px; overflow-y: auto; border-right: 2px solid rgba(255,255,255,0.1); }
        #sidebar.open { left: 0; }
        .toggle-btn { position: fixed; top: 15px; left: 15px; z-index: 60; background: rgba(0,0,0,0.6); color: white; padding: 10px 15px; border-radius: 8px; cursor: pointer; backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.2); }
        .return-btn { display: block; width: 100%; text-align: center; background: #ef4444; color: white; padding: 10px; border-radius: 8px; text-decoration: none; font-weight: bold; margin-bottom: 20px; }

        /* 狀態列 */
        .status-ui { position: fixed; top: 15px; right: 15px; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 12px; color: white; z-index: 20; text-align: right; pointer-events: none;}
        .energy-bar { width: 150px; height: 10px; background: #333; border-radius: 5px; margin-top: 5px; overflow: hidden; }
        .energy-fill { height: 100%; background: #10b981; width: 100%; transition: width 0.3s; }

        /* 背包與合成列表 */
        #inventory-list, #recipe-list { max-height: 250px; overflow-y: auto; padding-right: 5px; }
        #recipe-list::-webkit-scrollbar, #inventory-list::-webkit-scrollbar { width: 6px; }
        #recipe-list::-webkit-scrollbar-thumb, #inventory-list::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }

        /* 快捷列 */
        #hotbar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 5px; background: rgba(0,0,0,0.6); padding: 8px; border-radius: 12px; z-index: 30; }
        .slot { width: 50px; height: 50px; border: 2px solid #555; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 24px; color: white; position: relative; cursor: pointer; background: rgba(255,255,255,0.1); pointer-events: auto; }
        .slot.active { border-color: #fbbf24; background: rgba(251, 191, 36, 0.2); box-shadow: 0 0 10px rgba(251,191,36,0.6); }
        .slot-count { position: absolute; bottom: 2px; right: 4px; font-size: 12px; font-weight: bold; text-shadow: 1px 1px 2px black; }

        /* 手機控制 */
        #controls { position: fixed; bottom: 90px; right: 20px; z-index: 30; display: flex; flex-direction: column; gap: 10px; }
        .action-btn { width: 60px; height: 60px; border-radius: 50%; background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.5); color: white; display: flex; align-items: center; justify-content: center; font-size: 24px; backdrop-filter: blur(4px); pointer-events: auto; }
        #joystick-bg { position: fixed; bottom: 40px; left: 20px; width: 120px; height: 120px; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; z-index: 30; backdrop-filter: blur(4px); pointer-events: auto; }
        #joystick-knob { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: rgba(255,255,255,0.7); border-radius: 50%; pointer-events: none; }

        /* 沉浸式 UI 特效 */
        #crosshair { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: rgba(255,255,255,0.8); font-size: 24px; pointer-events: none; z-index: 10; text-shadow: 0 0 2px black; }
        #msg-box { position: fixed; top: 20%; left: 50%; transform: translateX(-50%); font-size: 24px; font-weight: bold; color: #fbbf24; text-shadow: 2px 2px 4px black; z-index: 100; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        #view-model { position: fixed; bottom: -50px; right: 10%; font-size: 150px; z-index: 15; transform-origin: bottom right; transition: transform 0.1s; pointer-events: none; filter: drop-shadow(0px 10px 10px rgba(0,0,0,0.5)); }
        .swing { animation: swingAnim 0.3s ease-in-out; }
        @keyframes swingAnim { 0% { transform: rotate(0deg) translateY(0); } 50% { transform: rotate(-40deg) translateY(-50px) translateX(-30px); } 100% { transform: rotate(0deg) translateY(0); } }
        
        #water-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(20, 80, 200, 0.4); z-index: 5; pointer-events: none; opacity: 0; transition: opacity 0.3s; backdrop-filter: blur(2px); }

        /* 對話與題目浮層 */
        .overlay-box { display: none; position: fixed; top: 10%; left: 50%; transform: translateX(-50%); width: 90%; max-width: 600px; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(8px); border: 2px solid #3b82f6; border-radius: 16px; padding: 24px; color: white; z-index: 200; box-shadow: 0 20px 40px rgba(0,0,0,0.8); max-height: 80vh; overflow-y: auto; }
        .quiz-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); padding: 12px; margin: 8px 0; border-radius: 8px; cursor: pointer; width: 100%; text-align: left; color: white; font-size: 16px; transition: 0.2s; }
        .quiz-btn:hover { background: rgba(59, 130, 246, 0.5); border-color: #3b82f6; }
    </style>
</head>
<body>

    <div id="water-overlay"></div>
    <div id="crosshair">✚</div>
    <div id="msg-box">系統訊息</div>
    <div id="view-model">👊</div>

    <button class="toggle-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i> 選單</button>

    <div id="sidebar">
        <h2 class="text-xl font-bold mb-4"><i class="fas fa-cube text-blue-400"></i> 極致生存選單</h2>
        <a href="arcade.html" class="return-btn"><i class="fas fa-sign-out-alt"></i> 返回學習遊戲場</a>
        
        <div class="mb-4 bg-slate-800 p-3 rounded-lg">
            <p class="text-sm">玩家: <span id="user-name" class="text-yellow-400 font-bold">載入中</span></p>
            <p class="text-sm">XP: <span id="xp-val" class="text-blue-400 font-bold">0</span></p>
        </div>

        <div class="mb-4">
            <div class="flex justify-between items-center border-b border-gray-600 pb-1 mb-2">
                <h3 class="text-sm text-gray-400">生存背包</h3>
                <span id="inv-count" class="text-xs text-gray-500">0/200</span>
            </div>
            <div id="inventory-list" class="grid grid-cols-5 gap-2"></div>
        </div>

        <div>
            <h3 class="text-sm text-gray-400 mb-2 border-b border-gray-600 pb-1">萬物合成台</h3>
            <div id="recipe-list" class="flex flex-col gap-2"></div>
        </div>
    </div>

    <div class="status-ui">
        <div class="font-bold text-sm">體力 <span id="energy-txt">100</span></div>
        <div class="energy-bar"><div id="energy-fill" class="energy-fill"></div></div>
    </div>

    <div id="hotbar"></div>
    <div id="joystick-bg"><div id="joystick-knob"></div></div>
    <div id="controls">
        <button id="btn-interact" class="action-btn" style="background: rgba(59, 130, 246, 0.4);"><i class="fas fa-hand-pointer"></i></button>
        <button id="btn-place" class="action-btn"><i class="fas fa-cube"></i></button>
        <button id="btn-break" class="action-btn" style="background: rgba(239, 68, 68, 0.4);"><i class="fas fa-hammer"></i></button>
    </div>

    <div id="quiz-overlay" class="overlay-box">
        <div class="flex justify-between items-center mb-4 border-b border-gray-600 pb-2">
            <h2 id="quiz-title" class="text-xl font-bold text-yellow-400">知識挑戰</h2>
        </div>
        <div id="quiz-question" class="text-lg mb-6">載入中...</div>
        <div id="quiz-options"></div>
        <div class="mt-4 text-right"><button onclick="closeUI()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded">逃跑</button></div>
    </div>

    <div id="npc-dialog" class="overlay-box border-emerald-500">
        <h2 id="npc-name" class="text-xl font-bold text-emerald-400 mb-2"><i class="fas fa-user"></i> NPC</h2>
        <p id="npc-lore" class="text-sm text-gray-400 mb-4 italic">"閒聊內容..."</p>
        <div class="bg-slate-800 p-3 rounded mb-6">
            <p class="text-sm font-bold text-yellow-400 mb-1">任務需求：</p>
            <p id="npc-quest" class="text-base">需要 5 個木頭</p>
            <p id="npc-reward" class="text-sm text-blue-300 mt-1">獎勵: 蘋果 x5</p>
        </div>
        <div class="flex flex-col gap-2">
            <button id="npc-submit" class="px-4 py-3 bg-emerald-600 hover:bg-emerald-500 rounded text-white font-bold">交付任務</button>
            <button onclick="closeUI()" class="px-4 py-3 bg-slate-700 hover:bg-slate-600 rounded text-white">下次再說</button>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. 資料庫 (物品、合成)
        // ==========================================
        const ITEM_REGISTRY = {}; const RECIPES = []; let playerInventory = {};
        const baseMats = [
            { id: 'wood', n: '木頭', i: '🪵' }, { id: 'stone', n: '石頭', i: '🪨' },
            { id: 'iron_ore', n: '鐵礦石', i: '🪨' }, { id: 'gold_ore', n: '金礦石', i: '🪨' },
            { id: 'diamond_ore', n: '鑽石礦', i: '💎' }, { id: 'stick', n: '木棍', i: '🦯' },
            { id: 'iron_ingot', n: '鐵錠', i: '⚪' }, { id: 'gold_ingot', n: '金錠', i: '🟡' },
            { id: 'diamond', n: '鑽石', i: '💎' }, { id: 'slime', n: '粘液', i: '💧' },
            { id: 'coal', n: '煤炭', i: '⚫' }
        ];
        const foodMats = [
            { id: 'apple', n: '蘋果', i: '🍎', r: 10 }, { id: 'wheat', n: '小麥', i: '🌾', r: 5 },
            { id: 'seeds', n: '種子', i: '🌱', r: 0 }, { id: 'meat', n: '生肉', i: '🥩', r: 5 }
        ];

        [...baseMats, ...foodMats].forEach(m => ITEM_REGISTRY[m.id] = { name: m.n, icon: m.i, type: m.r !== undefined ? (m.r>0?'food':'farm') : 'mat', restore: m.r });
        
        RECIPES.push({ id: 'stick', name: '木棍 x4', icon: '🦯', req: [{id:'wood', count:2}], count: 4 });
        RECIPES.push({ id: 'torch', name: '火把 x4', icon: '🔥', req: [{id:'stick', count:1}, {id:'coal', count:1}], count: 4 });
        ITEM_REGISTRY['torch'] = { name: '火把', icon: '🔥', type: 'block' };

        const NPCS = [
            { id: 'mayor', name: '村長 阿爾伯特', icon: '👴', lore: ['年輕人，這個村子需要你。', '多讀書，多看報。'], quest: { req: [{id:'wood', c:10}], reward: [{id:'apple', c:5}], txt: '幫我收集建材，我給你蘋果！' } }
        ];

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSnd(t) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            let d = 0.1;
            if(t==='hit') { osc.type='square'; osc.frequency.setValueAtTime(120, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime+0.1); }
            else if(t==='success') { osc.type='sine'; osc.frequency.setValueAtTime(400, audioCtx.currentTime); osc.frequency.setValueAtTime(800, audioCtx.currentTime+0.1); d=0.2; }
            else if(t==='error') { osc.type='sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime+0.3); d=0.3; }
            osc.start(); gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime+d); osc.stop(audioCtx.currentTime+d);
        }

        let currentUser = { username: "guest", xp: 0 };
        window.onload = () => {
            try {
                if (typeof Auth !== 'undefined' && Auth.getCurrentUser()) currentUser = Auth.getCurrentUser();
            } catch(e) { console.warn("Auth system not found, using default."); }
            document.getElementById('user-name').innerText = currentUser.username;
            document.getElementById('xp-val').innerText = currentUser.xp || 0;
            renderUI();
        };

        let energy = 100; let selectedSlot = 0;
        playerInventory['wood'] = 10; playerInventory['stone'] = 10; playerInventory['apple'] = 5;

        function modifyEnergy(amt) { energy = Math.max(0, Math.min(100, energy + amt)); document.getElementById('energy-fill').style.width = `${energy}%`; document.getElementById('energy-txt').innerText = Math.floor(energy); }
        function showMsg(txt, color='#fbbf24') { const m = document.getElementById('msg-box'); m.innerText = txt; m.style.color = color; m.style.opacity = 1; setTimeout(() => m.style.opacity = 0, 2500); }
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); renderUI(); }
        function closeUI() { document.querySelectorAll('.overlay-box').forEach(el => el.style.display = 'none'); activeInteractObj = null; }

        function renderUI() {
            const invKeys = Object.keys(playerInventory).filter(k => playerInventory[k] > 0);
            document.getElementById('inv-count').innerText = `${invKeys.length}/${Object.keys(ITEM_REGISTRY).length}`;
            const invList = document.getElementById('inventory-list'); invList.innerHTML = '';
            const hb = document.getElementById('hotbar'); hb.innerHTML = '';
            
            invKeys.forEach((key, idx) => {
                const item = ITEM_REGISTRY[key]; const count = playerInventory[key];
                const d = document.createElement('div'); d.className = `slot bg-slate-800`; d.title = item.name;
                d.innerHTML = `${item.icon}<span class="slot-count">${count}</span>`;
                d.onclick = () => { if(item.type === 'food') { modifyEnergy(item.restore); playerInventory[key]--; playSnd('success'); renderUI(); } };
                invList.appendChild(d);
                if(idx < 6) {
                    const hd = document.createElement('div'); hd.className = `slot ${idx === selectedSlot ? 'active' : ''}`;
                    hd.innerHTML = `${item.icon}<span class="slot-count">${count}</span>`;
                    hd.onclick = () => { selectedSlot = idx; renderUI(); document.getElementById('view-model').innerText = item.icon; };
                    hb.appendChild(hd);
                }
            });

            if(invKeys.length > 0 && selectedSlot < invKeys.length) document.getElementById('view-model').innerText = ITEM_REGISTRY[invKeys[selectedSlot]].icon;
            else document.getElementById('view-model').innerText = '👊';
        }

        // ==========================================
        // 2. Three.js: 地形生成與修復
        // ==========================================
        const scene = new THREE.Scene(); scene.fog = new THREE.Fog(0x87CEEB, 2, 40);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 100);
        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setPixelRatio(1); renderer.setSize(window.innerWidth, window.innerHeight); document.body.appendChild(renderer.domElement);
        scene.add(new THREE.AmbientLight(0xffffff, 0.6)); const dirLight = new THREE.DirectionalLight(0xffffff, 0.8); dirLight.position.set(20, 50, 20); scene.add(dirLight);

        function gTex(base, noise, char='') {
            const cvs = document.createElement('canvas'); cvs.width=16; cvs.height=16; const ctx = cvs.getContext('2d');
            ctx.fillStyle = base; ctx.fillRect(0,0,16,16); ctx.fillStyle = noise;
            if(char) { ctx.fillStyle='white'; ctx.font='14px Arial'; ctx.fillText(char, 2, 13); }
            else { for(let i=0;i<256;i++) if(Math.random()<0.3) ctx.fillRect(i%16, Math.floor(i/16), 1, 1); }
            const tex = new THREE.CanvasTexture(cvs); tex.magFilter = THREE.NearestFilter; return new THREE.MeshLambertMaterial({ map: tex });
        }
        
        const BLOCK = { AIR:0, GRASS:1, DIRT:2, STONE:3, WOOD:4, LEAVES:5, QUESTION:6, CHEST:7, FARMLAND:8, WATER:9, TALLGRASS:10 };
        const box = new THREE.BoxGeometry(1,1,1);
        const MATS = { 
            [BLOCK.GRASS]: gTex('#55aa55','#449944'), [BLOCK.DIRT]: gTex('#8b5a2b','#7a491a'),
            [BLOCK.STONE]: gTex('#888888','#666666'), [BLOCK.WOOD]: gTex('#5c4033','#4b3022'),
            [BLOCK.LEAVES]: gTex('#228b22','#117a11'), [BLOCK.QUESTION]: gTex('#fbbf24','#f59e0b','?'),
            [BLOCK.TALLGRASS]: gTex('#66cc66','#55bb55', '🌿'),
            [BLOCK.WATER]: new THREE.MeshLambertMaterial({color: 0x3b82f6, transparent:true, opacity:0.6})
        };

        const chunks = new Map(); const interactables = []; let activeInteractObj = null;

        noise.seed(Math.random());
        function getH(x, z) {
            let e = noise.perlin2(x/40, z/40) + 0.5 * noise.perlin2(x/20, z/20);
            return Math.floor(Math.pow((e+1.5)/2, 2) * 12) + 1; 
        }

        // 🚀 關鍵修復：計算出生點地形高度，防活埋！
        const startH = getH(0, 0);
        camera.position.set(0, startH + 5, 0); // 保證出生在空中並降落

        function genChunk(cx, cz) {
            const key = `${cx},${cz}`; if(chunks.has(key)) return chunks.get(key);
            const counts = {}; const poses = [];
            Object.values(BLOCK).forEach(v => counts[v]=0);

            for(let x=0; x<16; x++) {
                for(let z=0; z<16; z++) {
                    const wx=cx*16+x, wz=cz*16+z;
                    const h = getH(wx, wz);
                    
                    for(let y=0; y<=3; y++) {
                        if(y > h) { poses.push({x:wx, y, z:wz, t:BLOCK.WATER}); counts[BLOCK.WATER]++; }
                    }

                    for(let y=0; y<=h; y++) {
                        let t = (y === h) ? (h < 4 ? BLOCK.DIRT : BLOCK.GRASS) : (y > h-3 ? BLOCK.DIRT : BLOCK.STONE);
                        poses.push({x:wx, y, z:wz, t}); counts[t]++;
                    }

                    if(h >= 4 && Math.random() < 0.02) { // 樹
                        for(let ty=1; ty<=3; ty++) { poses.push({x:wx, y:h+ty, z:wz, t:BLOCK.WOOD}); counts[BLOCK.WOOD]++; }
                        poses.push({x:wx, y:h+4, z:wz, t:BLOCK.LEAVES}); counts[BLOCK.LEAVES]++;
                    } else if(h >= 4 && Math.random() < 0.003) { // 🚀 關鍵修復：大幅下調題目方塊出現率 (0.015 -> 0.003)
                        const q = new THREE.Mesh(box, MATS[BLOCK.QUESTION]);
                        q.position.set(wx, h+1, wz); q.userData = { isQ:true, wy:h+1 }; scene.add(q); interactables.push(q);
                    } else if(h >= 4 && Math.random() < 0.08) { // 芒草
                        poses.push({x:wx, y:h+1, z:wz, t:BLOCK.TALLGRASS}); counts[BLOCK.TALLGRASS]++;
                    }
                }
            }

            const group = new THREE.Group(); const insts = {}; const ptrs = {};
            Object.keys(counts).forEach(t => { 
                if(counts[t]>0 && MATS[t]) {
                    insts[t] = new THREE.InstancedMesh(box, MATS[t], counts[t]); group.add(insts[t]); ptrs[t]=0; 
                }
            });
            const dummy = new THREE.Object3D();
            poses.forEach(p => { 
                if(insts[p.t]) {
                    if(p.t === BLOCK.TALLGRASS) { dummy.scale.set(0.6, 0.6, 0.6); dummy.position.set(p.x, p.y-0.2, p.z); }
                    else { dummy.scale.set(1,1,1); dummy.position.set(p.x, p.y, p.z); }
                    dummy.updateMatrix(); insts[p.t].setMatrixAt(ptrs[p.t]++, dummy.matrix); 
                }
            });
            
            scene.add(group); chunks.set(key, {group, active:true}); return chunks.get(key);
        }

        // ==========================================
        // 3. 互動邏輯 (電腦與手機視角/滑桿拆分防干擾)
        // ==========================================
        const raycaster = new THREE.Raycaster();

        function interact(action) {
            const vm = document.getElementById('view-model'); vm.classList.remove('swing'); void vm.offsetWidth; vm.classList.add('swing');
            if(energy <= 0) return;

            raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
            const intersects = raycaster.intersectObjects(interactables);
            
            if(intersects.length > 0 && intersects[0].distance < 6) {
                const obj = intersects[0].object;
                if(action === 'interact') {
                    if(obj.userData.isNPC) openNpc(obj.userData.data);
                    else if(obj.userData.isQ) openQuiz(obj);
                    return;
                }
            }

            if(action === 'break') {
                modifyEnergy(-2); playSnd('hit');
                const rnd = Math.random();
                if(rnd < 0.3) { playerInventory['stone'] = (playerInventory['stone']||0)+1; showMsg('挖到 🪨石頭'); }
                else if(rnd < 0.6) { playerInventory['wood'] = (playerInventory['wood']||0)+1; showMsg('砍伐 🪵木頭'); }
                renderUI();
            }
        }

        document.getElementById('btn-interact').onclick = () => interact('interact');
        document.getElementById('btn-break').onclick = () => interact('break');

        // ==== 控制器變數 ====
        const keys = {w:false, a:false, s:false, d:false};
        const joyBg = document.getElementById('joystick-bg'), joyKnob = document.getElementById('joystick-knob');
        
        // 🚀 關鍵修復：電腦滑鼠拖曳視角
        let isMouseDragging = false;
        document.addEventListener('mousedown', e => { if(e.target.tagName === 'CANVAS') isMouseDragging = true; });
        document.addEventListener('mousemove', e => { 
            if(isMouseDragging) { 
                camera.rotation.y -= e.movementX*0.005; 
                camera.rotation.x -= e.movementY*0.005; 
                camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x)); 
                camera.rotation.order='YXZ'; 
            } 
        });
        document.addEventListener('mouseup', () => isMouseDragging = false);

        // 🚀 關鍵修復：手機觸控拖曳視角 (避開 UI 按鈕與搖桿)
        let isTouchDragging = false; let lastTouch = {x:0, y:0};
        document.addEventListener('touchstart', e => {
            if(e.target.tagName === 'BUTTON' || e.target.closest('#joystick-bg') || e.target.closest('.overlay-box')) return;
            isTouchDragging = true; lastTouch = {x: e.touches[0].clientX, y: e.touches[0].clientY};
        }, {passive: false});

        document.addEventListener('touchmove', e => {
            if(isTouchDragging) {
                const dx = e.touches[0].clientX - lastTouch.x;
                const dy = e.touches[0].clientY - lastTouch.y;
                camera.rotation.y -= dx * 0.005; 
                camera.rotation.x -= dy * 0.005; 
                camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x)); 
                camera.rotation.order='YXZ';
                lastTouch = {x: e.touches[0].clientX, y: e.touches[0].clientY};
            }
        }, {passive: false});
        document.addEventListener('touchend', () => isTouchDragging = false);

        // ==== 鍵盤與虛擬搖桿移動控制 ====
        document.addEventListener('keydown', e => { if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true; });
        document.addEventListener('keyup', e => { if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false; });

        joyBg.addEventListener('touchstart', e => handleJoy(e.touches[0]));
        joyBg.addEventListener('touchmove', e => { handleJoy(e.touches[0]); e.preventDefault(); }, {passive:false});
        joyBg.addEventListener('touchend', () => { joyKnob.style.transform=`translate(0,0)`; keys.w=keys.s=keys.a=keys.d=false; });
        function handleJoy(t) {
            const rect = joyBg.getBoundingClientRect(); let nx=t.clientX-rect.left-60, ny=t.clientY-rect.top-60;
            const dist = Math.sqrt(nx*nx + ny*ny); if(dist>60) { nx=nx/dist*60; ny=ny/dist*60; }
            joyKnob.style.transform = `translate(${nx}px, ${ny}px)`; 
            keys.w=ny<-15; keys.s=ny>15; keys.a=nx<-15; keys.d=nx>15;
        }

        const clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate); const delta = Math.min(clock.getDelta(), 0.1); const time = Date.now();
            
            // 速度計算
            let speed = (energy > 0 ? 6 : 2);
            let dz = Number(keys.w) - Number(keys.s); let dx = Number(keys.d) - Number(keys.a);
            
            // 🚀 關鍵修復：絕對水平移動 (不被上下視角干擾)
            if(dz !== 0 || dx !== 0) {
                const euler = new THREE.Euler(0, camera.rotation.y, 0, 'YXZ');
                const velocity = new THREE.Vector3(dx * speed, 0, -dz * speed);
                velocity.applyEuler(euler);
                camera.position.x += velocity.x * delta;
                camera.position.z += velocity.z * delta;
            }
            
            // 物理高度跟隨 (吸附地表)
            const px = camera.position.x, pz = camera.position.z;
            const h = getH(px, pz);
            camera.position.y += ((h + 2) - camera.position.y) * 0.1;

            // 區塊載入
            const cx = Math.floor(px/16), cz = Math.floor(pz/16);
            for(let x=-2; x<=2; x++) for(let z=-2; z<=2; z++) { const key = `${cx+x},${cz+z}`; if(!chunks.has(key)) genChunk(cx+x, cz+z); else chunks.get(key).group.visible = true; }

            // 實體動畫
            interactables.forEach(b => {
                if(b.userData.isQ) { b.rotation.y += 0.02; b.position.y = b.userData.wy + Math.sin(time*0.002)*0.2; }
            });

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => { camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
        
        renderUI(); animate();
    </script>
</body>
</html>
