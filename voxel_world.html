<body>

    <script>
// ==========================================
// 1. 全域變數與資料庫
// ==========================================
let isQuizOpen = false; 
const clock = new THREE.Clock();

const ITEM_REGISTRY = {
    'wood': { n: '木頭', i: '🪵', type: 'block' }, 'stone': { n: '石頭', i: '🪨', type: 'block' }, 
    'dirt': { n: '泥土', i: '🟤', type: 'block' }, 'leaves': { n: '樹葉', i: '🍃', type: 'block' },

    'sand': { n: '沙子', i: '⏳', type: 'block' }, 'coal': { n: '煤炭', i: '⚫', type: 'mat' },
    'iron_ore': { n: '鐵礦', i: '⛓️', type: 'mat' }, 'gas': { n: '瓦斯', i: '💨', type: 'mat' },
    'stick': { n: '木棍', i: '🦯', type: 'mat' }, 'plank': { n: '木板', i: '🪵', type: 'mat' },
    'salt': { n: '鹽巴', i: '🧂', type: 'mat' }, 'diamond': { n: '鑽石', i: '💎', type: 'mat' },
    'iron_ingot': { n: '鐵錠', i: '⚪', type: 'mat' }, 'glass': { n: '玻璃杯', i: '🥛', type: 'mat' },
    'torch': { n: '火把', i: '🔦', type: 'mat' }, 'leather': { n: '皮革', i: '👞', type: 'mat' },
    'meat_pig': { n: '生豬肉', i: '🥩', type: 'food', e: 10, h: -5 }, 'meat_cow': { n: '生牛肉', i: '🥩', type: 'food', e: 12, h: -5 },
    'meat_chicken': { n: '生雞肉', i: '🍗', type: 'food', e: 8, h: -8 }, 'egg': { n: '雞蛋', i: '🥚', type: 'food', e: 5, h: 0 },
    'milk': { n: '鮮乳', i: '🥛', type: 'food', e: 15, h: 10 }, 'cow_hide': { n: '牛皮', i: '📜', type: 'mat' }, 'wool': { n: '羊毛', i: '☁️', type: 'mat' },
    'carrot': { n: '胡蘿蔔', i: '🥕', type: 'food', e: 15, h: 5 }, 'potato': { n: '馬鈴薯', i: '🥔', type: 'food', e: 15, h: 5 },
    'tomato': { n: '番茄', i: '🍅', type: 'food', e: 10, h: 5 }, 'corn': { n: '玉米', i: '🌽', type: 'food', e: 20, h: 5 },
    'cabbage': { n: '高麗菜', i: '🥬', type: 'food', e: 15, h: 5 }, 'onion': { n: '洋蔥', i: '🧅', type: 'food', e: 10, h: 5 },
    'garlic': { n: '大蒜', i: '🧄', type: 'food', e: 5, h: 2 }, 'pumpkin': { n: '南瓜', i: '🎃', type: 'block', e: 25, h: 10 },
    'eggplant': { n: '茄子', i: '🍆', type: 'food', e: 15, h: 5 }, 'chili': { n: '辣椒', i: '🌶️', type: 'food', e: 5, h: -5 },
    'cucumber': { n: '小黃瓜', i: '🥒', type: 'food', e: 10, h: 5 }, 'apple': { n: '蘋果', i: '🍎', type: 'food', e: 20, h: 10 }, 
    'banana': { n: '香蕉', i: '🍌', type: 'food', e: 25, h: 10 }, 'grape': { n: '葡萄', i: '🍇', type: 'food', e: 15, h: 8 }, 
    'orange': { n: '橘子', i: '🍊', type: 'food', e: 18, h: 10 }, 'watermelon': { n: '西瓜', i: '🍉', type: 'food', e: 30, h: 15 }, 
    'strawberry': { n: '草莓', i: '🍓', type: 'food', e: 12, h: 8 }, 'pineapple': { n: '鳳梨', i: '🍍', type: 'food', e: 25, h: 12 }, 
    'peach': { n: '桃子', i: '🍑', type: 'food', e: 22, h: 10 }, 'lemon': { n: '檸檬', i: '🍋', type: 'food', e: 10, h: 15 }, 
    'cherry': { n: '櫻桃', i: '🍒', type: 'food', e: 10, h: 5 },
    'cooked_meat_pig': { n: '烤豬肉', i: '🍖', type: 'food', e: 50, h: 20 }, 'salted_meat_pig': { n: '鹽漬豬肉', i: '🥩', type: 'food', e: 45, h: 25 },
    'cooked_meat_cow': { n: '戰斧牛排', i: '🥩', type: 'food', e: 60, h: 30 }, 'salted_meat_cow': { n: '鹽醃牛肉', i: '🥩', type: 'food', e: 55, h: 25 }, 
    'cooked_chicken': { n: '烤雞腿', i: '🍗', type: 'food', e: 45, h: 20 }, 'boiled_egg': { n: '水煮蛋', i: '🥚', type: 'food', e: 20, h: 15 },
    'bacon': { n: '煙燻培根', i: '🥓', type: 'food', e: 55, h: 15 }, 'salad_mixed': { n: '綜合沙拉', i: '🥗', type: 'food', e: 50, h: 35 },
    'baked_potato': { n: '烤馬鈴薯', i: '🥔', type: 'food', e: 40, h: 15 }, 'corn_soup': { n: '玉米濃湯', i: '🥣', type: 'food', e: 50, h: 40 },
    'pickled_cucumber': { n: '鹽漬小黃瓜', i: '🥒', type: 'food', e: 25, h: 15 }, 'fried_eggplant': { n: '油炸茄子', i: '🍆', type: 'food', e: 35, h: 10 }, 
    'pumpkin_pie': { n: '南瓜派', i: '🥧', type: 'food', e: 60, h: 20 }, 'onion_rings': { n: '炸洋蔥圈', i: '🧅', type: 'food', e: 30, h: 5 }, 
    'garlic_bread': { n: '大蒜麵包', i: '🥖', type: 'food', e: 40, h: 10 }, 'fruit_juice': { n: '綜合果汁', i: '🍹', type: 'food', e: 45, h: 30 },
    'banana_milk': { n: '香蕉牛奶', i: '🥤', type: 'food', e: 50, h: 35 }, 'lemonade': { n: '檸檬氣泡飲', i: '🍹', type: 'food', e: 30, h: 50 },
    'dried_grape': { n: '葡萄乾', i: '🍇', type: 'food', e: 30, h: 10 }, 'pineapple_slice': { n: '鳳梨切片', i: '🍍', type: 'food', e: 15, h: 5 }, 
    'watermelon_bucket': { n: '西瓜桶', i: '🍉', type: 'food', e: 60, h: 30 }, 'peach_jam': { n: '桃子果醬', i: '🍯', type: 'food', e: 50, h: 20 },
    'strawberry_cake': { n: '草莓蛋糕', i: '🍰', type: 'food', e: 70, h: 25 }, 'cooked_meat_salted': { n: '醃烤肉', i: '🍖', type: 'food', e: 60, h: 40 }
};

const RECIPES = [
    { id: 'stick', n: '木棍 x4', req: [{id:'wood', count:1}], outCount: 4 }, { id: 'plank', n: '木板 x4', req: [{id:'wood', count:1}], outCount: 4 },
    { id: 'salt', n: '精製鹽 x2', req: [{id:'salt_ore', count:1}], outCount: 2 }, { id: 'torch', n: '火把', req: [{id:'stick', count:1}, {id:'coal', count:1}], outCount: 1 },
    { id: 'glass', n: '玻璃杯', req: [{id:'sand', count:2}], outCount: 1 }, { id: 'iron_ingot', n: '鐵錠', req: [{id:'iron_ore', count:1}, {id:'coal', count:1}], outCount: 1 },
    { id: 'cooked_meat_pig', n: '烤豬肉', req: [{id:'meat_pig', count:1}, {id:'coal', count:1}], outCount: 1 }, { id: 'salted_meat_pig', n: '鹽漬豬肉', req: [{id:'meat_pig', count:1}, {id:'salt', count:1}], outCount: 1 },
    { id: 'salad_mixed', n: '綜合沙拉', req: [{id:'cabbage', count:1}, {id:'tomato', count:1}, {id:'carrot', count:1}], outCount: 1 },
    { id: 'fruit_juice', n: '綜合果汁', req: [{id:'apple', count:1}, {id:'orange', count:1}, {id:'strawberry', count:1}], outCount: 1 }
];

let inventory = { 'wood': 20, 'stone': 10, 'apple': 5, 'meat_pig': 3, 'salt': 10, 'carrot': 5, 'tomato': 5, 'cabbage': 5, 'diamond': 1, 'dirt': 10, 'salt_ore': 2 }; 
let hotbarSlots = Object.keys(inventory); 
let selectedSlotIndex = 0;
let hp = 100, energy = 100;

// 保底題庫
let bossQuestions = [
    { question: "國八理化：當冰塊融化成水時，下列何者「不變」？", options: ["體積", "密度", "質量", "狀態"], answer: 2 },
    { question: "國八理化：密度(D)、質量(M)、體積(V)的關係為何？", options: ["D=M*V", "D=V/M", "D=M/V", "M=D/V"], answer: 2 }
];
let currentBossQ = null;

// ==========================================
// 2. UI 更新與狀態
// ==========================================
function showMsg(txt, color='#fbbf24') { 
    const m = document.getElementById('msg-box'); 
    m.innerText = txt; m.style.color = color; m.style.opacity = 1; 
    setTimeout(() => m.style.opacity = 0, 2000); 
}

function updateStats(hpChange, energyChange) {
    hp = Math.max(0, Math.min(100, hp + hpChange)); 
    energy = Math.max(0, Math.min(100, energy + energyChange));
    document.getElementById('hp-fill').style.width = `${hp}%`; 
    document.getElementById('hp-txt').innerText = Math.floor(hp);
    document.getElementById('energy-fill').style.width = `${energy}%`; 
    document.getElementById('energy-txt').innerText = Math.floor(energy);
    if (hp <= 0) { showMsg("💀 你餓死/摔死了！", "red"); resetPlayer(); }
}

function resetPlayer() { camera.position.set(0, 5, 0); hp = 100; energy = 100; updateStats(0,0); }

function consumeItem(itemId) {
    const item = ITEM_REGISTRY[itemId];
    if (item && item.type === 'food' && inventory[itemId] > 0) {
        inventory[itemId]--;
        updateStats(item.h||0, item.e);
        showMsg(`😋 吃了 ${item.n}！`, '#10b981');
        if (inventory[itemId] <= 0) delete inventory[itemId];
        renderUI();
    }
}

function renderUI() {
    hotbarSlots = Object.keys(inventory); 
    const invDiv = document.getElementById('inventory-list'); invDiv.innerHTML = '';
    Object.keys(inventory).forEach(key => {
        if(inventory[key] > 0) {
            const item = ITEM_REGISTRY[key] || { n: '未知', i: '❓' };
            invDiv.innerHTML += `<div class="slot bg-slate-800" title="${item.n}">${item.i}<span class="slot-count">${inventory[key]}</span></div>`;
        }
    });

    const recDiv = document.getElementById('recipe-list'); recDiv.innerHTML = '';
    RECIPES.forEach(r => {
        const canCraft = r.req.every(req => (inventory[req.id] || 0) >= req.count);
        let reqHtml = r.req.map(req => `<span class="text-xs bg-black/40 px-1 rounded">${ITEM_REGISTRY[req.id].i}x${req.count}</span>`).join(' ');
        recDiv.innerHTML += `
            <div class="flex justify-between items-center p-2 rounded ${canCraft ? 'bg-blue-900/60' : 'bg-slate-800 opacity-50'}">
                <div class="flex items-center gap-2"><span class="text-2xl">${ITEM_REGISTRY[r.id] ? ITEM_REGISTRY[r.id].i : '❓'}</span>
                <div><div class="font-bold text-sm">${r.n}</div><div class="flex gap-1 mt-1">${reqHtml}</div></div></div>
                <button onclick="craft('${r.id}')" class="px-3 py-1 bg-blue-600 rounded text-xs text-white ${!canCraft?'hidden':''}">合成</button>
            </div>`;
    });

    const hotbarDiv = document.getElementById('hotbar'); hotbarDiv.innerHTML = '';
    hotbarSlots.forEach((itemId, i) => {
        const item = ITEM_REGISTRY[itemId] || { n: '未知物品', i: '❓', type: 'none' };
        const div = document.createElement('div');
        div.className = `slot ${i === selectedSlotIndex ? 'active' : ''}`;
        div.innerHTML = `${item.i}<span class="slot-count">${inventory[itemId]}</span>`;
        
        div.onclick = (e) => {
            if (selectedSlotIndex === i && item.type === 'food') consumeItem(itemId); 
            else selectedSlotIndex = i; 
            renderUI();
            div.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        };
        hotbarDiv.appendChild(div);
    });

    const currentItem = hotbarSlots[selectedSlotIndex];
    document.getElementById('view-model').innerText = currentItem ? (ITEM_REGISTRY[currentItem] ? ITEM_REGISTRY[currentItem].i : '❓') : '👊';
}

function craft(recipeId) {
    const r = RECIPES.find(x => x.id === recipeId);
    if(r.req.every(req => (inventory[req.id] || 0) >= req.count)) {
        r.req.forEach(req => inventory[req.id] -= req.count);
        inventory[r.id] = (inventory[r.id] || 0) + r.outCount;
        showMsg(`🔨 合成了 ${ITEM_REGISTRY[r.id].n}`, '#3b82f6');
        renderUI();
    }
}

// ==========================================
// 3. 👹 閻羅王題目方塊讀取邏輯 (核心升級)
// ==========================================
function openBossQuiz() {
    if (isQuizOpen || energy < 20) return;
    isQuizOpen = true;
    document.getElementById('boss-quiz-overlay').style.display = 'block';
    
    // 定義所有科目庫
    const allSubjects = [
        'math', 'physics', 'chemistry', 'biology', 'earth_science', 
        'english', 'chinese', 'history', 'geography', 'civics'
    ];
    // 隨機抽一個科目
    const randomSubject = allSubjects[Math.floor(Math.random() * allSubjects.length)];

    // 清空舊畫面
    document.getElementById('boss-question').innerHTML = `正在向地府題庫讀取 [${randomSubject}] 題目...`;
    const ops = document.getElementById('boss-options'); 
    ops.innerHTML = '';

    // 呼叫外部題庫引擎 (generator_engine)
    if(typeof window.generatePaper === 'function') {
        try {
            console.log(`📡 正在請求科目: ${randomSubject}`);
            const cloudQ = window.generatePaper({ 
                subject: randomSubject, 
                total: 1, 
                tags: [] 
            });
            
            if(cloudQ && cloudQ.length > 0) {
                bossQuestions = cloudQ; // 覆蓋保底題目
            }
        } catch(e) {
            console.error("題庫讀取失敗，使用預設保底題目", e);
        }
    }

    // 選出一題並渲染
    currentBossQ = bossQuestions[Math.floor(Math.random() * bossQuestions.length)];
    
    // 加上科目提示標籤
    document.getElementById('boss-question').innerHTML = 
        `<span style="color:#fbbf24; font-weight:bold;">[${randomSubject.toUpperCase()}]</span><br><br>` + 
        currentBossQ.question.replace(/\n/g, '<br>');
    
    currentBossQ.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = "quiz-btn w-full text-left p-3 rounded-lg bg-slate-800 border border-slate-700";
        btn.innerHTML = `${String.fromCharCode(65+idx)}. ${opt}`;
        btn.onclick = () => checkBossAnswer(idx);
        ops.appendChild(btn);
    });

    // 解析數學公式
    if(window.MathJax) MathJax.typesetPromise();
}

function checkBossAnswer(selectedIdx) {
    if (selectedIdx === currentBossQ.answer) {
        showMsg("🎉 正確！地府認證全能王！獲得獎勵", "#10b981");
        inventory['diamond'] = (inventory['diamond'] || 0) + 2;
        inventory['cooked_meat_salted'] = (inventory['cooked_meat_salted'] || 0) + 1;
        setTimeout(() => { closeBossQuiz(true); }, 1500);
    } else {
        showMsg("💥 答錯了！受到地府的懲罰！", "red");
        updateStats(-30, -10);
        setTimeout(() => closeBossQuiz(false), 1500);
    }
}

function closeBossQuiz(isVictory = false) {
    document.getElementById('boss-quiz-overlay').style.display = 'none';
    isQuizOpen = false;
    if(!isVictory) updateStats(0, -10); 
    renderUI();
}

// ==========================================
// 4. Three.js: 世界建設與實體
// ==========================================
const scene = new THREE.Scene(); 
scene.fog = new THREE.FogExp2(0x87CEEB, 0.05);
const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 100);
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio > 1 ? 1.5 : 1);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.5); 
dirLight.position.set(10, 20, 10); 
scene.add(dirLight);

function createColorMat(color) { return new THREE.MeshLambertMaterial({ color }); }
const MATS = {
    grass: createColorMat(0x55aa55), dirt: createColorMat(0x8b5a2b), stone: createColorMat(0x888888),
    wood: createColorMat(0x5c4033), leaves: createColorMat(0x228b22), pig: createColorMat(0xffc0cb),
    cow: createColorMat(0x7f4c1e), salt: createColorMat(0xffffff),
    boss: new THREE.MeshPhongMaterial({ color: 0x220000, emissive: 0xef4444 })
};
const boxGeo = new THREE.BoxGeometry(1, 1, 1);

const blocks = new Map();
const entities = [];
let bossEntity = null;
noise.seed(Math.random());

function getBlockKey(x, y, z) { return `${Math.floor(x)},${Math.floor(y)},${Math.floor(z)}`; }

function addBlock(x, y, z, type) {
    const mesh = new THREE.Mesh(boxGeo, MATS[type] || MATS.dirt);
    mesh.position.set(x, y, z); mesh.userData.type = type;
    scene.add(mesh); blocks.set(getBlockKey(x, y, z), mesh);
}

function spawnBoss(x = 0, y = 10, z = -20) {
    const boss = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), MATS.boss);
    boss.position.set(x, y, z);
    boss.userData.isBoss = true;
    boss.userData.type = 'boss_cube'; 
    scene.add(boss);
    if (!bossEntity) bossEntity = boss; 
    blocks.set(getBlockKey(x, y, z), boss);
}

function spawnAnimal(type, pos) {
    const group = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.6, 1.2), MATS[type]); body.position.y = 0.6; group.add(body);
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), MATS[type]); head.position.set(0, 0.8, -0.7); group.add(head);
    if (pos) group.position.copy(pos);
    else group.position.set((Math.random()-0.5)*30, 5, (Math.random()-0.5)*30);
    group.userData = { type, velY: 0, isJumping: false };
    scene.add(group);
    entities.push({ group, velocity: new THREE.Vector3(0, 0, 0), nextStateTime: 0, state: 'idle' });
}

function spawnTree(x, z, h) {
    for(let y=h+1; y<=h+3; y++) addBlock(x, y, z, 'wood'); 
    for(let ox=-1; ox<=1; ox++) for(let oz=-1; oz<=1; oz++) addBlock(x+ox, h+4, z+oz, 'leaves'); 
}

let lastChunkX = -999, lastChunkZ = -999;
function updateInfiniteTerrain() {
    const pX = Math.floor(camera.position.x);
    const pZ = Math.floor(camera.position.z);
    
    const currChunkX = Math.floor(pX / 10);
    const currChunkZ = Math.floor(pZ / 10);
    if (currChunkX === lastChunkX && currChunkZ === lastChunkZ) return;
    lastChunkX = currChunkX; lastChunkZ = currChunkZ;

    const range = 20; 
    for (let x = pX - range; x < pX + range; x++) {
        for (let z = pZ - range; z < pZ + range; z++) {
            const key = getBlockKey(x, 0, z);
            if (!blocks.has(key)) {
                // 生成草地
                addBlock(x, 0, z, 'grass');
                
                // 🌳 加入生成樹木 (2% 機率)
                if (Math.random() < 0.02) spawnTree(x, z, 0); 
                
                if (Math.random() < 0.002) spawnBoss(x, 1, z); 
                if (Math.random() < 0.02) {
                    const plants = ['apple', 'banana', 'carrot', 'tomato', 'grass_bush'];
                    addBlock(x, 1, z, plants[Math.floor(Math.random() * plants.length)]);
                }
            }
        }
    }
}

// ==========================================
// 5. 互動、移動與主循環
// ==========================================
let moveInput = { x: 0, y: 0 }, lookInput = { x: 0, y: 0 };
const keysPressed = {};
const raycaster = new THREE.Raycaster();
const center = new THREE.Vector2(0, 0);

function updateCrosshairSystem() {
    raycaster.setFromCamera(center, camera);
    const allTargets = [ bossEntity, ...scene.children.filter(obj => obj.geometry && obj.geometry.type === 'BoxGeometry'), ...entities.map(e => e.group) ];
    const intersects = raycaster.intersectObjects(allTargets, true);
    
    const crosshairEl = document.getElementById('crosshair');
    const targetInfoEl = document.getElementById('target-info');

    if (intersects.length > 0 && intersects[0].distance < 10) {
        const target = intersects[0].object;
        const dist = Math.floor(intersects[0].distance);
        crosshairEl.style.transform = 'scale(1.3)'; 
        targetInfoEl.style.opacity = '1';

        if (target === bossEntity || target.userData.type === 'boss_cube') {
            crosshairEl.style.color = '#ef4444'; 
            targetInfoEl.innerText = `👹 閻羅王 (${dist}m)`;
        } else if (target.parent && target.parent.userData.type) { 
            crosshairEl.style.color = '#fbbf24'; 
            targetInfoEl.innerText = `${target.parent.userData.type === 'pig' ? '🐷' : '🐮'} 動物 (${dist}m)`;
        } else { 
            crosshairEl.style.color = 'rgba(255,255,255,0.9)'; 
            targetInfoEl.innerText = `🧱 ${ITEM_REGISTRY[target.userData.type] ? ITEM_REGISTRY[target.userData.type].n : '方塊'} (${dist}m)`;
        }
    } else {
        crosshairEl.style.transform = 'scale(1)'; crosshairEl.style.color = 'rgba(255,255,255,0.8)'; targetInfoEl.style.opacity = '0';
    }
}

function handleInteraction() {
    if (isQuizOpen) return;
    raycaster.setFromCamera(center, camera);
    const intersects = raycaster.intersectObjects(scene.children, true);
    
    if(intersects.length > 0 && intersects[0].distance < 8) {
        const target = intersects[0].object;
        if (target.userData.isBoss || target === bossEntity) {
            openBossQuiz();
            return;
        }
        
        const type = target.userData.type;
        if (['apple', 'banana', 'carrot', 'leaves', 'grass_bush'].includes(type)) {
            inventory[type] = (inventory[type] || 0) + 1;
            scene.remove(target);
            showMsg(`🌿 採集了 ${ITEM_REGISTRY[type].n}`);
            renderUI();
        } else if (type === 'salt_ore') {
            showMsg("🧂 這是一塊鹽礦，請用紅色錘子開採！");
        }
    }
}

function swingHand() {
    const vm = document.getElementById('view-model');
    vm.classList.remove('swing'); void vm.offsetWidth; vm.classList.add('swing');
    updateStats(0, -1); 
}

// 紅色錘子 - 攻擊/挖掘
document.getElementById('btn-break').onclick = () => {
    if (energy < 5) { showMsg("🔋 體力不足！需休息或吃東西", "#ff4444"); return; }
    swingHand();

    raycaster.setFromCamera(center, camera);
    const intersects = raycaster.intersectObjects(scene.children, true);

    // ⚔️ 已修正：將 distance 改為 8，確保打得到動物
    if (intersects.length > 0 && intersects[0].distance < 8) {
        const target = intersects[0].object;
        let animalGroup = target;
        while(animalGroup && !animalGroup.userData.type) animalGroup = animalGroup.parent;

        if (animalGroup && ['pig', 'cow'].includes(animalGroup.userData.type)) {
            const type = animalGroup.userData.type;
            if (type === 'pig') {
                inventory['meat_pig'] = (inventory['meat_pig'] || 0) + 1;
                if (Math.random() > 0.5) inventory['gas'] = (inventory['gas'] || 0) + 1;
            } else {
                inventory['meat_cow'] = (inventory['meat_cow'] || 0) + 1;
                inventory['leather'] = (inventory['leather'] || 0) + 1;
                inventory['milk'] = (inventory['milk'] || 0) + 1;
            }

            scene.remove(animalGroup); 
            const idx = entities.findIndex(e => e.group === animalGroup);
            if(idx > -1) entities.splice(idx, 1);
            
            updateStats(0, -5); 
            showMsg(`⚔️ 成功獵捕 ${type === 'pig' ? '豬' : '牛'}！`);
            renderUI();
            return;
        }

        if (target.userData.type && !target.userData.isBoss) {
            const blockType = target.userData.type;
            inventory[blockType] = (inventory[blockType] || 0) + 1;
            scene.remove(target);
            blocks.delete(getBlockKey(target.position.x, target.position.y, target.position.z));
            updateStats(0, -2); 
            showMsg(`⛏️ 獲得 ${ITEM_REGISTRY[blockType].n}`);
            renderUI();
        } else if (target.userData.isBoss) {
            showMsg("👹 閻羅王不可破壞！", "red");
        }
    }
};

document.getElementById('btn-interact').onclick = handleInteraction;

document.getElementById('btn-place').onclick = () => {
    const currentItem = hotbarSlots[selectedSlotIndex];
    if (!currentItem || ITEM_REGISTRY[currentItem].type !== 'block' || inventory[currentItem] <= 0) return;
    raycaster.setFromCamera(center, camera);
    const intersects = raycaster.intersectObjects(scene.children).filter(i => i.object.geometry.type === 'BoxGeometry');
    if (intersects.length > 0 && intersects[0].distance < 8) {
        swingHand();
        const normal = intersects[0].face.normal;
        const pos = intersects[0].object.position.clone().add(normal);
        addBlock(pos.x, pos.y, pos.z, currentItem);
        inventory[currentItem]--;
        if(inventory[currentItem]<=0) delete inventory[currentItem];
        renderUI();
    }
};

// 鍵盤移動與數字鍵
document.addEventListener('keydown', e => {
    keysPressed[e.key.toLowerCase()] = true;
    if(['1','2','3','4','5','6','7','8'].includes(e.key)) {
        selectedSlotIndex = parseInt(e.key) - 1;
        if(selectedSlotIndex < hotbarSlots.length) { renderUI(); document.querySelector(`.slot:nth-child(${selectedSlotIndex+1})`)?.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' }); }
    }
    if(e.key === ' ' && !isQuizOpen) { handleInteraction(); e.preventDefault(); } 
});
document.addEventListener('keyup', e => keysPressed[e.key.toLowerCase()] = false);

// 🖱️ 已新增：綁定電腦滑鼠點擊 (左鍵攻擊/挖礦，右鍵放置方塊)
document.addEventListener('mousedown', (e) => {
    // 防止點擊到 UI 時誤觸動作
    if (e.target.tagName === 'BUTTON' || 
        e.target.closest('.status-ui') || 
        e.target.closest('#hotbar-outer') || 
        e.target.closest('#sidebar') || 
        e.target.closest('.overlay-box')) return;
    
    if (e.button === 0) { 
        document.getElementById('btn-break').click();
    } else if (e.button === 2) { 
        document.getElementById('btn-place').click();
    }
});
document.addEventListener('contextmenu', e => e.preventDefault());

// 搖桿設置
function setupJoy(id, knobId, outObj) {
    const zone = document.getElementById(id), knob = document.getElementById(knobId);
    let activeId = null; let centerX, centerY;
    zone.addEventListener('touchstart', e => { e.preventDefault(); activeId = e.changedTouches[0].identifier; const r = zone.getBoundingClientRect(); centerX = r.left + r.width/2; centerY = r.top + r.height/2; }, {passive:false});
    zone.addEventListener('touchmove', e => {
        e.preventDefault();
        for(let i=0; i<e.changedTouches.length; i++) {
            if(e.changedTouches[i].identifier === activeId) {
                const t = e.changedTouches[i];
                let dx = t.clientX - centerX, dy = t.clientY - centerY;
                const dist = Math.sqrt(dx*dx+dy*dy); const maxR = 40;
                if(dist>maxR) { dx *= maxR/dist; dy *= maxR/dist; }
                knob.style.transform = `translate(${dx}px, ${dy}px)`;
                outObj.x = dx/maxR; outObj.y = dy/maxR;
            }
        }
    }, {passive:false});
    zone.addEventListener('touchend', e => { for(let i=0; i<e.changedTouches.length; i++) if(e.changedTouches[i].identifier === activeId) { activeId=null; knob.style.transform='translate(0,0)'; outObj.x=0; outObj.y=0; } });
}
setupJoy('joystick-move', 'knob-move', moveInput);
setupJoy('joystick-look', 'knob-look', lookInput);

function updateEntities(delta) {
    entities.forEach(entity => {
        const { group } = entity;
        if (Date.now() > entity.nextStateTime) {
            const states = ['idle', 'walk', 'jump'];
            entity.state = states[Math.floor(Math.random() * states.length)];
            entity.nextStateTime = Date.now() + 2000 + Math.random() * 3000;

            if (entity.state === 'walk') {
                const angle = Math.random() * Math.PI * 2;
                entity.velocity.set(Math.cos(angle) * 0.02, 0, Math.sin(angle) * 0.02);
                group.rotation.y = -angle + Math.PI / 2;
            } else if (entity.state === 'jump' && !group.userData.isJumping) {
                group.userData.velY = 0.1;
                group.userData.isJumping = true;
            } else {
                entity.velocity.set(0, 0, 0);
            }
        }

        group.position.add(entity.velocity);
        group.userData.velY -= 0.005; 
        group.position.y += group.userData.velY;

        if (group.position.y < 0) {
            group.position.y = 0;
            group.userData.velY = 0;
            group.userData.isJumping = false;
        }
    });
}

function updateGame() {
    requestAnimationFrame(updateGame);
    const delta = clock.getDelta();
    
    if (isQuizOpen) { renderer.render(scene, camera); return; }

    camera.rotation.y -= lookInput.x * 0.03;
    camera.rotation.x -= lookInput.y * 0.03;
    camera.rotation.x = Math.max(-1.5, Math.min(1.5, camera.rotation.x));
    
    const speed = 0.15; 
    const dir = new THREE.Vector3();
    
    if(keysPressed['w']) dir.z -= 1; 
    if(keysPressed['s']) dir.z += 1;
    if(keysPressed['a']) dir.x -= 1; 
    if(keysPressed['d']) dir.x += 1;
    if(moveInput.x !== 0 || moveInput.y !== 0) { dir.x += moveInput.x; dir.z += moveInput.y; }

    if(dir.length() > 0) {
        const playerRotY = camera.rotation.y;
        dir.normalize().applyAxisAngle(new THREE.Vector3(0, 1, 0), playerRotY);
        camera.position.addScaledVector(dir, speed);
        updateInfiniteTerrain();
    }

    updateEntities(delta);
    updateCrosshairSystem();

    if (bossEntity) {
        bossEntity.rotation.y += 0.01;
        const pulse = 1 + Math.sin(Date.now() * 0.005) * 0.1;
        bossEntity.scale.set(pulse, pulse, pulse);
        const dist = Math.floor(camera.position.distanceTo(bossEntity.position));
        document.getElementById('boss-dist').innerText = dist;
    }

    renderer.render(scene, camera);
}

window.onload = () => { initGame(); };
window.addEventListener('resize', () => { 
    camera.aspect = window.innerWidth/window.innerHeight; 
    camera.updateProjectionMatrix(); 
    renderer.setSize(window.innerWidth, window.innerHeight); 
});

function initGame() {
    console.log("🚀 正在啟動生存世界...");
    renderUI();
    updateStats(0,0);
    camera.position.set(0, 5, 10);
    camera.lookAt(0, 0, 0);

    lastChunkX = -999;
    updateInfiniteTerrain(); 
    spawnBoss(0, 5, -10);
    
    for(let i=0; i<15; i++) {
        const type = (i % 2 === 0 ? 'pig' : 'cow');
        const rx = (Math.random() - 0.5) * 40;
        const rz = (Math.random() - 0.5) * 40;
        spawnAnimal(type, new THREE.Vector3(rx, 5, rz)); 
    }
    updateGame(); 
}
