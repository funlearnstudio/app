<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <script src="https://cdn.tailwindcss.com"></script>

    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { margin: 0; overflow: hidden; font-family: 'Noto Sans TC', sans-serif; touch-action: none; user-select: none; background-color: #87CEEB; }
        
        #boss-navigator { position: fixed; top: 15px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); color: #ff4444; padding: 10px 25px; border-radius: 30px; font-weight: bold; z-index: 100; border: 2px solid #ff4444; backdrop-filter: blur(4px); display: flex; align-items: center; gap: 10px; font-size: 16px; text-shadow: 0 0 5px #ff0000; box-shadow: 0 0 15px rgba(255,0,0,0.5); }
        #crosshair-container { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10; pointer-events: none; text-align: center; }
        #crosshair { color: rgba(255,255,255,0.8); font-size: 28px; text-shadow: 0 0 3px black; transition: all 0.1s; }
        #target-info { color: white; font-size: 14px; margin-top: 8px; text-shadow: 1px 1px 2px black; opacity: 0; transition: opacity 0.2s; background: rgba(0,0,0,0.4); padding: 2px 8px; border-radius: 4px; }
        #view-model { position: fixed; bottom: -30px; right: 15%; font-size: 120px; z-index: 15; transform-origin: bottom right; transition: transform 0.1s; pointer-events: none; filter: drop-shadow(0px 10px 10px rgba(0,0,0,0.5)); }
        
        #hotbar-outer { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 40; width: 310px; background: rgba(0,0,0,0.8); padding: 8px; border-radius: 16px; backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.2); pointer-events: auto; }
        #hotbar { display: flex; gap: 6px; overflow-x: auto; scroll-snap-type: x mandatory; }
        #hotbar::-webkit-scrollbar { display: none; }
        .slot { flex: 0 0 45px; width: 45px; height: 45px; border: 2px solid #555; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 24px; color: white; position: relative; cursor: pointer; background: rgba(255,255,255,0.1); scroll-snap-align: start; transition: transform 0.1s; }
        .slot.active { border-color: #fbbf24; background: rgba(251, 191, 36, 0.3); box-shadow: 0 0 15px rgba(251,191,36,0.8); transform: scale(1.1); }
        .slot-count { position: absolute; bottom: 2px; right: 4px; font-size: 11px; font-weight: bold; text-shadow: 1px 1px 2px black; }

        .status-ui { position: fixed; top: 15px; right: 15px; background: rgba(0,0,0,0.6); padding: 12px; border-radius: 12px; color: white; z-index: 20; min-width: 160px; pointer-events: none; backdrop-filter: blur(4px); }
        .stat-bar { width: 100%; height: 10px; background: #333; border-radius: 5px; margin-top: 4px; overflow: hidden; border: 1px solid #555; }
        .hp-fill { height: 100%; background: #ef4444; width: 100%; transition: width 0.3s; }
        .energy-fill { height: 100%; background: #10b981; width: 100%; transition: width 0.3s; }

        .overlay-box { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 500px; background: rgba(15, 23, 42, 0.98); backdrop-filter: blur(8px); border: 2px solid #ef4444; border-radius: 16px; padding: 24px; color: white; z-index: 200; box-shadow: 0 0 30px rgba(239, 68, 68, 0.5); max-height: 80vh; overflow-y: auto; }
        .quiz-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); padding: 12px; margin: 8px 0; border-radius: 8px; cursor: pointer; width: 100%; text-align: left; color: white; font-size: 16px; transition: 0.2s; }
        .quiz-btn:hover { background: rgba(239, 68, 68, 0.5); border-color: #ef4444; }

        #controls { position: fixed; bottom: 260px; right: 30px; z-index: 30; display: flex; flex-direction: column; gap: 15px; pointer-events: auto; }
        .action-btn { width: 60px; height: 60px; border-radius: 50%; background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.5); color: white; display: flex; align-items: center; justify-content: center; font-size: 24px; backdrop-filter: blur(4px); }
        .action-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.4); }

        .joystick-zone { position: fixed; bottom: 120px; width: 130px; height: 130px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; z-index: 30; backdrop-filter: blur(4px); pointer-events: auto; }
        #joystick-move { left: 30px; }
        #joystick-look { right: 30px; background: rgba(255,100,100,0.1); border-color: rgba(255,100,100,0.3); }
        .joystick-knob { position: absolute; top: 40px; left: 40px; width: 50px; height: 50px; background: rgba(255,255,255,0.8); border-radius: 50%; pointer-events: none; }
        
        #msg-box { position: fixed; top: 15%; left: 50%; transform: translateX(-50%); font-size: 22px; font-weight: bold; color: #fbbf24; text-shadow: 2px 2px 4px black; z-index: 100; opacity: 0; transition: opacity 0.3s; pointer-events: none; width: 100%; text-align: center; }
        .swing { animation: swingAnim 0.2s ease-in-out; }
        @keyframes swingAnim { 0% { transform: rotate(0deg) translateY(0); } 50% { transform: rotate(-40deg) translateY(-30px) translateX(-20px); } 100% { transform: rotate(0deg) translateY(0); } }
    </style>
</head>
<body>

    <div id="boss-navigator"><i class="fas fa-skull"></i> 魔王距離: <span id="boss-dist">---</span>m</div>
    <div id="crosshair-container"><div id="crosshair">✚</div><div id="target-info">瞄準中...</div></div>
    <div id="msg-box">系統訊息</div>
    <div id="view-model">👊</div>

    <div class="status-ui">
        <div class="flex justify-between text-xs font-bold text-red-400 mb-1"><span>生命 HP</span><span id="hp-txt">100</span></div>
        <div class="stat-bar mb-2"><div id="hp-fill" class="hp-fill"></div></div>
        <div class="flex justify-between text-xs font-bold text-emerald-400 mb-1"><span>體力 Energy</span><span id="energy-txt">100</span></div>
        <div class="stat-bar"><div id="energy-fill" class="energy-fill"></div></div>
    </div>

    <div id="boss-quiz-overlay" class="overlay-box">
        <h2 class="text-2xl font-bold text-red-400 mb-4 border-b border-gray-700 pb-2"><i class="fas fa-skull"></i> 閻羅王的終極審判！</h2>
        <div id="boss-question" class="text-gray-200 text-lg mb-6 leading-relaxed">正在向地府題庫讀取題目...</div>
        <div id="boss-options" class="space-y-3"></div>
        <div class="mt-6 text-right">
            <button onclick="closeBossQuiz()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded">逃跑 (-20 體力)</button>
        </div>
    </div>

    <div id="hotbar-outer"><div id="hotbar"></div></div>
    <div id="controls">
        <button id="btn-interact" class="action-btn" style="background: rgba(59, 130, 246, 0.4); border-color: #3b82f6;"><i class="fas fa-hand-pointer"></i></button>
        <button id="btn-place" class="action-btn" style="background: rgba(16, 185, 129, 0.4); border-color: #10b981;"><i class="fas fa-cube"></i></button>
        <button id="btn-break" class="action-btn" style="background: rgba(239, 68, 68, 0.4); border-color: #ef4444;"><i class="fas fa-fire"></i></button>
    </div>
    
    <div id="joystick-move" class="joystick-zone"><div class="joystick-knob" id="knob-move"></div></div>
    <div id="joystick-look" class="joystick-zone"><div class="joystick-knob" id="knob-look"></div></div>

    <script>
// ==========================================
// 1. 基本設定與物品清單
// ==========================================
let isQuizOpen = false;
const clock = new THREE.Clock();
const ITEM_REGISTRY = {
    'wood': { n: '木頭', i: '🪵', type: 'block' }, 'dirt': { n: '泥土', i: '🟤', type: 'block' }, 
    'leaves': { n: '樹葉', i: '🍃', type: 'block' }, 'stone': { n: '石頭', i: '🪨', type: 'block' },
    'meat_pig': { n: '生豬肉', i: '🥩', type: 'food', e: 10, h: -5 }, 'rotten_flesh': { n: '腐肉', i: '🧟', type: 'food', e: 5, h: -15 },
    'apple': { n: '蘋果', i: '🍎', type: 'food', e: 20, h: 10 }, 'diamond': { n: '鑽石', i: '💎', type: 'mat' }
};

let inventory = { 'wood': 20, 'dirt': 10, 'apple': 5 }; 
let hotbarSlots = Object.keys(inventory); 
let selectedSlotIndex = 0;
let hp = 100, energy = 100;

// 保底題庫
let bossQuestions = [{ question: "保底題目：遇到打不開的知識時該怎麼辦？", options: ["放棄", "發呆", "繼續探索", "睡覺"], answer: 2 }];
let currentBossQ = null;

function showMsg(txt, color='#fbbf24') { 
    const m = document.getElementById('msg-box'); m.innerText = txt; m.style.color = color; m.style.opacity = 1; 
    setTimeout(() => m.style.opacity = 0, 2000); 
}

function updateStats(hpChange, energyChange) {
    hp = Math.max(0, Math.min(100, hp + hpChange)); energy = Math.max(0, Math.min(100, energy + energyChange));
    document.getElementById('hp-fill').style.width = `${hp}%`; document.getElementById('hp-txt').innerText = Math.floor(hp);
    document.getElementById('energy-fill').style.width = `${energy}%`; document.getElementById('energy-txt').innerText = Math.floor(energy);
    if (hp <= 0) { showMsg("💀 你死了！", "red"); setTimeout(() => { hp=100; energy=100; camera.position.set(0,5,0); updateStats(0,0); }, 2000); }
}

function renderUI() {
    hotbarSlots = Object.keys(inventory); 
    const hotbarDiv = document.getElementById('hotbar'); hotbarDiv.innerHTML = '';
    hotbarSlots.forEach((itemId, i) => {
        const item = ITEM_REGISTRY[itemId] || { n: '未知', i: '❓', type: 'none' };
        const div = document.createElement('div');
        div.className = `slot ${i === selectedSlotIndex ? 'active' : ''}`;
        div.innerHTML = `${item.i}<span class="slot-count">${inventory[itemId]}</span>`;
        div.onclick = () => {
            if (selectedSlotIndex === i && item.type === 'food') {
                inventory[itemId]--; updateStats(item.h, item.e); showMsg(`吃了 ${item.n}！`, '#10b981');
                if(inventory[itemId]<=0) delete inventory[itemId];
            } else selectedSlotIndex = i; 
            renderUI();
        };
        hotbarDiv.appendChild(div);
    });
}

// ==========================================
// 2. 魔王題庫邏輯 (全科隨機抽題)
// ==========================================
function openBossQuiz() {
    if (isQuizOpen || energy < 10) return;
    isQuizOpen = true;
    document.getElementById('boss-quiz-overlay').style.display = 'block';
    
    const allSubjects = ['math', 'physics', 'chemistry', 'biology', 'earth_science', 'english', 'chinese', 'history', 'geography', 'civics'];
    const randomSubject = allSubjects[Math.floor(Math.random() * allSubjects.length)];

    document.getElementById('boss-question').innerHTML = `正在向地府題庫讀取 [${randomSubject}] 題目...`;
    const ops = document.getElementById('boss-options'); ops.innerHTML = '';

    if(typeof window.generatePaper === 'function') {
        try {
            const cloudQ = window.generatePaper({ subject: randomSubject, total: 1, tags: [] });
            if(cloudQ && cloudQ.length > 0) bossQuestions = cloudQ;
        } catch(e) { console.error("題庫讀取失敗", e); }
    }

    currentBossQ = bossQuestions[Math.floor(Math.random() * bossQuestions.length)];
    document.getElementById('boss-question').innerHTML = `<span style="color:#fbbf24; font-weight:bold;">[${randomSubject.toUpperCase()}]</span><br><br>` + currentBossQ.question.replace(/\n/g, '<br>');
    
    currentBossQ.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = "quiz-btn w-full text-left p-3 rounded-lg bg-slate-800 border border-slate-700";
        btn.innerHTML = `${String.fromCharCode(65+idx)}. ${opt}`;
        btn.onclick = () => checkBossAnswer(idx);
        ops.appendChild(btn);
    });
    if(window.MathJax) MathJax.typesetPromise();
}

function checkBossAnswer(selectedIdx) {
    if (selectedIdx === currentBossQ.answer) {
        showMsg("🎉 正確！地府認證全能王！", "#10b981");
        inventory['diamond'] = (inventory['diamond'] || 0) + 1;
        setTimeout(() => closeBossQuiz(true), 1500);
    } else {
        showMsg("💥 答錯了！受到地府的懲罰！", "red");
        updateStats(-30, -10);
        setTimeout(() => closeBossQuiz(false), 1500);
    }
}

function closeBossQuiz(isVictory = false) {
    document.getElementById('boss-quiz-overlay').style.display = 'none';
    isQuizOpen = false;
    if(!isVictory) updateStats(0, -10); 
    renderUI();
}

// ==========================================
// 3. Three.js: 世界光影與實體
// ==========================================
const scene = new THREE.Scene(); 
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.FogExp2(0x87CEEB, 0.04);
const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 100);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true; // 開啟陰影
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.4));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8); 
dirLight.position.set(20, 50, 20); 
dirLight.castShadow = true; 
dirLight.shadow.mapSize.width = 1024; dirLight.shadow.mapSize.height = 1024;
dirLight.shadow.camera.near = 0.5; dirLight.shadow.camera.far = 100;
dirLight.shadow.camera.left = -30; dirLight.shadow.camera.right = 30;
dirLight.shadow.camera.top = 30; dirLight.shadow.camera.bottom = -30;
scene.add(dirLight);

function createColorMat(color) { return new THREE.MeshLambertMaterial({ color }); }
const MATS = {
    grass: createColorMat(0x55aa55), dirt: createColorMat(0x8b5a2b), wood: createColorMat(0x5c4033), leaves: createColorMat(0x228b22), 
    pig: createColorMat(0xffb6c1), zombie: createColorMat(0x2ca02c), boss: new THREE.MeshPhongMaterial({ color: 0x220000, emissive: 0xef4444 })
};
const boxGeo = new THREE.BoxGeometry(1, 1, 1);
const blocks = new Map();
const entities = [];
const projectiles = []; 
let bossEntity = null;
noise.seed(Math.random());

function getBlockKey(x, y, z) { return `${Math.floor(x)},${Math.floor(y)},${Math.floor(z)}`; }

function addBlock(x, y, z, type) {
    const mesh = new THREE.Mesh(boxGeo, MATS[type] || MATS.dirt);
    mesh.position.set(x, y, z); mesh.userData.type = type;
    mesh.castShadow = true; mesh.receiveShadow = true;
    scene.add(mesh); blocks.set(getBlockKey(x, y, z), mesh);
}

function spawnBoss(x = 0, y = 5, z = -20) {
    const boss = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), MATS.boss);
    boss.position.set(x, y, z);
    boss.userData.isBoss = true; boss.castShadow = true;
    scene.add(boss);
    bossEntity = boss;
}

function spawnAnimal(type, pos) {
    const group = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.6, 1.2), MATS[type]); 
    body.position.y = 0.6; body.castShadow = true; group.add(body);
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), MATS[type]); 
    head.position.set(0, 0.8, -0.7); head.castShadow = true; group.add(head);
    
    group.position.copy(pos);
    group.userData = { type, velY: 0, hp: (type==='zombie'?3:1), lastAttack: 0 };
    scene.add(group);
    entities.push({ group, velocity: new THREE.Vector3(0, 0, 0), state: 'idle' });
}

function spawnTree(x, z, h) {
    for(let y=h+1; y<=h+3; y++) addBlock(x, y, z, 'wood'); 
    for(let ox=-1; ox<=1; ox++) for(let oz=-1; oz<=1; oz++) addBlock(x+ox, h+4, z+oz, 'leaves'); 
}

let lastChunkX = -999, lastChunkZ = -999;
function updateInfiniteTerrain() {
    const pX = Math.floor(camera.position.x); const pZ = Math.floor(camera.position.z);
    const currChunkX = Math.floor(pX / 10); const currChunkZ = Math.floor(pZ / 10);
    if (currChunkX === lastChunkX && currChunkZ === lastChunkZ) return;
    lastChunkX = currChunkX; lastChunkZ = currChunkZ;

    for (let x = pX - 20; x < pX + 20; x++) {
        for (let z = pZ - 20; z < pZ + 20; z++) {
            if (!blocks.has(getBlockKey(x, 0, z))) {
                addBlock(x, 0, z, 'grass');
                if (Math.random() < 0.02) spawnTree(x, z, 0); 
            }
        }
    }
}

// ==========================================
// 4. 戰鬥與互動系統
// ==========================================
const raycaster = new THREE.Raycaster();
const center = new THREE.Vector2(0, 0);

// 更新十字準心
function updateCrosshairSystem() {
    raycaster.setFromCamera(center, camera);
    const allTargets = [ bossEntity, ...scene.children.filter(obj => obj.geometry && obj.geometry.type === 'BoxGeometry'), ...entities.map(e => e.group) ];
    const intersects = raycaster.intersectObjects(allTargets, true);
    
    const crossEl = document.getElementById('crosshair');
    const infoEl = document.getElementById('target-info');

    if (intersects.length > 0 && intersects[0].distance < 12) {
        const target = intersects[0].object;
        crossEl.style.transform = 'scale(1.3)'; infoEl.style.opacity = '1';
        if (target === bossEntity) {
            crossEl.style.color = '#ef4444'; infoEl.innerText = `👹 閻羅王`;
        } else if (target.parent && target.parent.userData.type === 'zombie') {
            crossEl.style.color = '#2ca02c'; infoEl.innerText = `🧟 殭屍`;
        } else if (target.parent && target.parent.userData.type === 'pig') {
            crossEl.style.color = '#fbbf24'; infoEl.innerText = `🐷 豬`;
        } else { crossEl.style.color = 'white'; infoEl.innerText = `🧱 方塊`; }
    } else {
        crossEl.style.transform = 'scale(1)'; crossEl.style.color = 'rgba(255,255,255,0.8)'; infoEl.style.opacity = '0';
    }
}

// 發射火球 (紅色按鈕 / 滑鼠左鍵)
document.getElementById('btn-break').onclick = () => {
    if (energy < 2) { showMsg("🔋 體力不足！", "#ff4444"); return; }
    document.getElementById('view-model').classList.add('swing');
    setTimeout(() => document.getElementById('view-model').classList.remove('swing'), 200);
    updateStats(0, -2); 

    const bullet = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 8), new THREE.MeshBasicMaterial({ color: 0xff3300 }));
    bullet.position.copy(camera.position);
    const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
    bullet.userData = { velocity: dir.multiplyScalar(0.8), life: 60 }; 
    scene.add(bullet);
    projectiles.push(bullet);
};

// 藍色互動鍵 (對話大魔王 / 採集)
document.getElementById('btn-interact').onclick = () => {
    raycaster.setFromCamera(center, camera);
    const intersects = raycaster.intersectObjects([bossEntity, ...scene.children], true);
    if(intersects.length > 0 && intersects[0].distance < 8) {
        let target = intersects[0].object;
        if (target === bossEntity) { openBossQuiz(); return; }
    }
};

// 綠色放置鍵 (滑鼠右鍵)
document.getElementById('btn-place').onclick = () => {
    const item = hotbarSlots[selectedSlotIndex];
    if (!item || inventory[item] <= 0 || !ITEM_REGISTRY[item] || ITEM_REGISTRY[item].type !== 'block') return;
    raycaster.setFromCamera(center, camera);
    const intersects = raycaster.intersectObjects(scene.children).filter(i => i.object.geometry.type === 'BoxGeometry');
    if (intersects.length > 0 && intersects[0].distance < 8) {
        const pos = intersects[0].object.position.clone().add(intersects[0].face.normal);
        addBlock(pos.x, pos.y, pos.z, item);
        inventory[item]--; if(inventory[item]<=0) delete inventory[item];
        renderUI();
    }
};

// 滑鼠支援
document.addEventListener('mousedown', (e) => {
    if (e.target.tagName === 'BUTTON' || e.target.closest('.status-ui') || e.target.closest('.overlay-box')) return;
    if (e.button === 0) document.getElementById('btn-break').click(); 
    else if (e.button === 2) document.getElementById('btn-place').click(); 
});
document.addEventListener('contextmenu', e => e.preventDefault());

// 搖桿與鍵盤
let moveInput = { x: 0, y: 0 }, lookInput = { x: 0, y: 0 };
const keysPressed = {};
document.addEventListener('keydown', e => keysPressed[e.key.toLowerCase()] = true);
document.addEventListener('keyup', e => keysPressed[e.key.toLowerCase()] = false);

function setupJoy(id, knobId, outObj) {
    const zone = document.getElementById(id), knob = document.getElementById(knobId);
    let activeId = null; let centerX, centerY;
    zone.addEventListener('touchstart', e => { e.preventDefault(); activeId = e.changedTouches[0].identifier; const r = zone.getBoundingClientRect(); centerX = r.left + r.width/2; centerY = r.top + r.height/2; }, {passive:false});
    zone.addEventListener('touchmove', e => {
        e.preventDefault();
        for(let i=0; i<e.changedTouches.length; i++) if(e.changedTouches[i].identifier === activeId) {
            let dx = e.changedTouches[i].clientX - centerX, dy = e.changedTouches[i].clientY - centerY;
            const dist = Math.sqrt(dx*dx+dy*dy); const maxR = 40;
            if(dist>maxR) { dx *= maxR/dist; dy *= maxR/dist; }
            knob.style.transform = `translate(${dx}px, ${dy}px)`;
            outObj.x = dx/maxR; outObj.y = dy/maxR;
        }
    }, {passive:false});
    zone.addEventListener('touchend', e => { for(let i=0; i<e.changedTouches.length; i++) if(e.changedTouches[i].identifier === activeId) { activeId=null; knob.style.transform='translate(0,0)'; outObj.x=0; outObj.y=0; } });
}
setupJoy('joystick-move', 'knob-move', moveInput); setupJoy('joystick-look', 'knob-look', lookInput);

// ==========================================
// 5. 遊戲主循環 (怪獸 AI 與 火球)
// ==========================================
function updateGame() {
    requestAnimationFrame(updateGame);
    if (isQuizOpen) { renderer.render(scene, camera); return; }

    // 玩家視角與移動
    camera.rotation.y -= lookInput.x * 0.04; camera.rotation.x -= lookInput.y * 0.04;
    camera.rotation.x = Math.max(-1.5, Math.min(1.5, camera.rotation.x));
    
    let dir = new THREE.Vector3();
    if(keysPressed['w']) dir.z -= 1; if(keysPressed['s']) dir.z += 1;
    if(keysPressed['a']) dir.x -= 1; if(keysPressed['d']) dir.x += 1;
    if(moveInput.x !== 0 || moveInput.y !== 0) { dir.x += moveInput.x; dir.z += moveInput.y; }
    
    if(dir.length() > 0) {
        dir.normalize().applyAxisAngle(new THREE.Vector3(0, 1, 0), camera.rotation.y);
        camera.position.addScaledVector(dir, 0.15);
        updateInfiniteTerrain();
    }

    updateCrosshairSystem();

    if (bossEntity) {
        bossEntity.rotation.y += 0.01;
        const pulse = 1 + Math.sin(Date.now() * 0.005) * 0.1;
        bossEntity.scale.set(pulse, pulse, pulse);
        document.getElementById('boss-dist').innerText = Math.floor(camera.position.distanceTo(bossEntity.position));
    }

    // 更新火球飛行與碰撞
    for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        p.position.add(p.userData.velocity);
        p.userData.life--;

        let hit = false;
        for (let j = entities.length - 1; j >= 0; j--) {
            const ent = entities[j];
            if (p.position.distanceTo(ent.group.position) < 1.5) {
                ent.group.userData.hp--;
                if(ent.group.userData.hp <= 0) {
                    scene.remove(ent.group);
                    if(ent.group.userData.type === 'zombie') {
                        inventory['rotten_flesh'] = (inventory['rotten_flesh']||0)+1; showMsg("⚔️ 擊殺殭屍！", "#10b981");
                    } else {
                        inventory['meat_pig'] = (inventory['meat_pig']||0)+1; showMsg("🍖 獲得肉類！", "#10b981");
                    }
                    entities.splice(j, 1); renderUI();
                } else showMsg("💥 擊中怪物！", "orange");
                hit = true; break;
            }
        }
        if (hit || p.userData.life <= 0) { scene.remove(p); projectiles.splice(i, 1); }
    }

    // 更新怪物 AI (殭屍追擊)
    entities.forEach(entity => {
        const type = entity.group.userData.type;
        const dist = entity.group.position.distanceTo(camera.position);

        if (type === 'zombie' && dist < 15) {
            const chaseDir = new THREE.Vector3().subVectors(camera.position, entity.group.position).normalize();
            entity.group.position.addScaledVector(chaseDir, 0.04);
            entity.group.lookAt(camera.position.x, entity.group.position.y, camera.position.z);
            if (dist < 2 && Date.now() > entity.group.userData.lastAttack) {
                updateStats(-15, 0); showMsg("🩸 被殭屍咬了！扣血", "red");
                entity.group.userData.lastAttack = Date.now() + 1500;
            }
        } else {
            if (Math.random() < 0.01) {
                const angle = Math.random() * Math.PI * 2;
                entity.velocity.set(Math.cos(angle)*0.02, 0, Math.sin(angle)*0.02);
                entity.group.rotation.y = -angle + Math.PI/2;
            }
            entity.group.position.add(entity.velocity);
        }
        if(entity.group.position.y > 0) entity.group.position.y -= 0.05;
        if(entity.group.position.y < 0) entity.group.position.y = 0;
    });

    renderer.render(scene, camera);
}

window.onload = () => {
    renderUI(); updateStats(0,0);
    camera.position.set(0, 5, 10);
    updateInfiniteTerrain(); 
    spawnBoss(0, 5, -20);
    
    for(let i=0; i<8; i++) spawnAnimal('pig', new THREE.Vector3((Math.random()-0.5)*30, 0, (Math.random()-0.5)*30));
    for(let i=0; i<6; i++) spawnAnimal('zombie', new THREE.Vector3((Math.random()-0.5)*40, 0, (Math.random()-0.5)*40));
    updateGame(); 
};
window.addEventListener('resize', () => { camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
    </script>
