<script>

// =========================================
// 1. 全域設定與常數 (必須放在最上面)
// =========================================
const GAS_URL = "https://script.google.com/macros/s/AKfycbzQlG5LVquExr4qDerEGX_OaeOPYqp9Nk2Xk7WuJRq55XOPzIQx977KjCCteiWuhGfY2Q/exec";

// =========================================
// 🚀 特權解鎖清單設定 (12 階級完整版)
// =========================================
const featuresList = [
    { xp: 100, name: "潛力新秀面板", icon: "fa-seedling", desc: "解鎖清新淺綠色磨砂背景" },
    { xp: 300, name: "勤奮書生面板", icon: "fa-book-open", desc: "解鎖溫暖橘色玻璃背景" },
    { xp: 1000, name: "白銀騎士面板", icon: "fa-shield-alt", desc: "解鎖冷冽金屬銀色主題" },
    { xp: 2500, name: "黃金菁英面板", icon: "fa-trophy", desc: "解鎖尊貴閃耀黃金主題" },
    { xp: 5000, name: "頂尖學者面板", icon: "fa-gem", desc: "解鎖鑽石藍尊榮主題" },
    { xp: 10000, name: "聖域大師面板", icon: "fa-fire", desc: "解鎖熱血紅色專屬主題" },
    { xp: 15000, name: "榮耀宗師面板", icon: "fa-chess-king", desc: "解鎖尊貴紫紅大師主題" },
    { xp: 20000, name: "傳奇領主面板", icon: "fa-crown", desc: "解鎖華麗深棕紅傳奇主題" },
    { xp: 30000, name: "史詩英雄面板", icon: "fa-dragon", desc: "解鎖極光夜空史詩主題" },
    { xp: 50000, name: "萬古神話流星", icon: "fa-meteor", desc: "解鎖深邃宇宙黑與專屬流星雨" },
    { xp: 100000, name: "創世星神領域", icon: "fa-sun", desc: "解鎖終極黑洞特效與加倍流星雨" }
];
const ThemeEngine = {
    apply: async function(username) {
        const body = document.body;
        console.log("🚀 [ThemeEngine] 啟動快照優先模式。用戶:", username);

        // --- 階段 1：立即從本地讀取 ---
        // 抓取整個物件，而不只是 XP，這樣更新時才不會丟失姓名等資料
        let userRaw = localStorage.getItem('currentUser');
        let userDataLocal = userRaw ? JSON.parse(userRaw) : { xp: 0 };
        let currentXP = Number(userDataLocal.xp) || 0;
        
        console.log("📦 [本地快照] 當前 XP:", currentXP);
        this.updateThemeUI(currentXP); 

        // --- 階段 2：背景同步雲端試算表 ---
        try {
            const response = await fetch(`${GAS_URL}?action=get_leaderboard`);
            const leaderboard = await response.json();
            
            const cloudUser = leaderboard.find(u => 
                String(u.username).trim().toLowerCase() === String(username).trim().toLowerCase()
            );

            if (cloudUser) {
                const cloudXP = Number(cloudUser.xp);
                console.log("✅ [雲端回傳] 最新 XP:", cloudXP);

                // ✨ 關鍵判斷：雲端與本地不一致時才更新
                if (cloudXP !== currentXP) {
                    console.log("✨ [同步] 偵測到數值差異，更新本地快照與 UI...");
                    
                    // 1. 更新內存物件中的 XP (保留原本的其他資料)
                    userDataLocal.xp = cloudXP;
                    // 如果雲端有回傳等級也順便更新
                    if (cloudUser.level) userDataLocal.level = cloudUser.level;

                    // 2. 寫回 localStorage
                    localStorage.setItem('currentUser', JSON.stringify(userDataLocal));
                    
                    // 3. 重新觸發染色與特效
                    this.updateThemeUI(cloudXP); 
                }
            } else {
                console.warn("⚠️ 雲端找不到該用戶資料。");
            }
        } catch (e) {
            console.error("❌ 雲端同步失敗:", e);
        }
    },

    updateThemeUI: function(xp) {
        const body = document.body;
        const themes = [
            'theme-novice', 'theme-rookie', 'theme-bronze', 'theme-silver', 
            'theme-gold', 'theme-diamond', 'theme-master', 'theme-grandmaster', 
            'theme-legend', 'theme-epic', 'theme-mythic', 'theme-celestial'
        ];
        body.classList.remove(...themes);

        let selected = 'theme-novice';
        if (xp >= 100000) selected = 'theme-celestial';
        else if (xp >= 50000) selected = 'theme-mythic';
        else if (xp >= 30000) selected = 'theme-epic';
        else if (xp >= 20000) selected = 'theme-legend';
        else if (xp >= 15000) selected = 'theme-grandmaster';
        else if (xp >= 10000) selected = 'theme-master';
        else if (xp >= 5000)  selected = 'theme-diamond';
        else if (xp >= 2500)  selected = 'theme-gold';
        else if (xp >= 1000)  selected = 'theme-silver';
        else if (xp >= 300)   selected = 'theme-bronze';
        else if (xp >= 100)   selected = 'theme-rookie';

        body.classList.add(selected);
        
        // 特效觸發
        if (xp >= 50000) {
            this.createStars(xp >= 100000 ? 15 : 8);
        }
    },

    createStars: function(starCount) {
        let container = document.getElementById('star-container');
        if (!container) {
            container = document.createElement('div');
            container.id = 'star-container';
            document.body.appendChild(container);
        }
        container.innerHTML = ''; 
        for (let i = 0; i < starCount; i++) {
            let star = document.createElement('div');
            star.className = 'shooting-star'; 
            star.style.top = Math.random() * 80 + 'vh';
            star.style.left = (Math.random() * 50 + 50) + 'vw';
            star.style.animationDelay = (Math.random() * 4) + 's';
            container.appendChild(star);
        }
    }
};
const SoundEngine = {
    // 把網址換成你本地端資料夾的路徑 👇
    bgm: new Audio('assets/bgm .mp3'), 
    gachaPull: new Audio('assets/pull.mp3'), 
    gachaWin: new Audio('assets/win.mp3'), 
    gachaFail: new Audio('assets/fail.mp3'), 

    init: function() {
        this.bgm.loop = true; 
        this.bgm.volume = 0.2; 
        this.gachaPull.volume = 0.6;
        this.gachaWin.volume = 0.8;
        this.gachaFail.volume = 0.8;
    },
    playBGM: function() {
        try {
            let playPromise = this.bgm.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => console.log("背景音樂等待使用者互動後播放"));
            }
        } catch(e) { console.log("音樂播放異常", e); }
    },
    playSound: function(type) {
        if (this[type]) {
            try {
                this[type].currentTime = 0;
                this[type].play().catch(e => console.log("音效被阻擋"));
            } catch(e) {}
        }
    }
};

// =========================================
// 3. UI 操作與抽獎功能
// =========================================
function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    if (sidebar.classList.contains('-translate-x-full')) {
        sidebar.classList.remove('-translate-x-full');
        overlay.classList.remove('hidden');
    } else {
        sidebar.classList.add('-translate-x-full');
        overlay.classList.add('hidden');
    }
}

function openProfileModal() {
    const user = Auth.getCurrentUser();
    if (!user || user.username === 'guest') {
        alert("訪客無法修改年級，請先登入！");
        return;
    }
    const select = document.getElementById('editGradeSelect');
    if (user.grade) select.value = user.grade;
    document.getElementById('profileModal').classList.remove('hidden');
}

function closeProfileModal() {
    document.getElementById('profileModal').classList.add('hidden');
}

async function saveProfile() {
    const user = Auth.getCurrentUser();
    const newGrade = document.getElementById('editGradeSelect').value;
    try {
        const response = await fetch(GAS_URL, {
            method: 'POST',
            body: JSON.stringify({ action: "update_grade", account: user.username, newGrade: newGrade })
        });
        const result = await response.json();
        if (result.status === "success") {
            user.grade = newGrade;
            localStorage.setItem('currentUser', JSON.stringify(user));
            alert("年級修改成功！");
            location.reload(); 
        } else {
            alert("修改失敗：" + result.message);
        }
    } catch (e) {
        alert("連線異常，請稍後再試");
    }
}
async function updateTicketUI() {
    let user = Auth.getCurrentUser();
    if (!user || user.username === 'guest') return;

    const ticketEl = document.getElementById('ticketCount');
    const btn = document.getElementById('drawGachaBtn');
    const DAILY_LIMIT = 3; // 每日限制 3 次

    if (ticketEl) ticketEl.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

    try {
        const response = await fetch(`${GAS_URL}?username=${encodeURIComponent(user.username)}&t=${Date.now()}`);
        const history = await response.json();
        
        if (!Array.isArray(history)) return;

        // 🌟 關鍵修改：取得今天的日期字串 (格式如 "2023/10/27" 或根據你後端存的格式)
        const todayStr = new Date().toLocaleDateString();

        // 篩選出「今天」已經抽過獎的紀錄
        const todayLottoRecords = history.filter(item => {
            const isLotto = String(item.activity || "").includes("幸運抽獎");
            // 假設你的後端紀錄中有 timestamp 或 date 欄位
            const recordDate = new Date(item.timestamp || item.date).toLocaleDateString();
            return isLotto && recordDate === todayStr;
        });

        const usedToday = todayLottoRecords.length;
        const remaining = Math.max(0, DAILY_LIMIT - usedToday);

        // 更新介面
        if (ticketEl) ticketEl.textContent = remaining;
        
        if (btn) {
            if (remaining > 0) {
                btn.disabled = false;
                btn.innerText = `今日剩餘 ${remaining} 次機會`;
                btn.classList.remove('opacity-50', 'grayscale');
            } else {
                btn.disabled = true;
                btn.innerText = "明天再來吧！今日次數已滿";
                btn.classList.add('opacity-50', 'grayscale');
            }
        }
        
        console.log(`📅 今日已抽：${usedToday} 次，剩餘：${remaining} 次`);

    } catch (e) {
        console.error("同步失敗:", e);
        if (ticketEl) ticketEl.textContent = "!";
    }
}
    async function playGacha() {
    let user = Auth.getCurrentUser();
    const ticketEl = document.getElementById('ticketCount');
    const resultDiv = document.getElementById('gachaResult');
    const btn = document.getElementById('drawGachaBtn');
    
    let remaining = parseInt(ticketEl.textContent) || 0;

    if (remaining <= 0) {
        resultDiv.innerHTML = "❌ 今日抽獎次數已達上限！";
        resultDiv.className = "mt-4 text-red-400 font-bold text-center";
        resultDiv.classList.remove('hidden');
        return;
    }

    // --- 動畫效果 ---
    SoundEngine.playSound('gachaPull');
    btn.disabled = true;
    btn.innerText = "✨ 命運轉動中...";
    btn.classList.add('opacity-70', 'animate-pulse');
    
    resultDiv.innerHTML = `
        <div class="flex flex-col items-center justify-center py-8">
            <div class="w-12 h-12 border-4 border-yellow-400 border-t-transparent rounded-full animate-spin"></div>
        </div>
    `;
    resultDiv.classList.remove('hidden');

    setTimeout(async () => {
        const rand = Math.random() * 100;
        let gainedXP = 0;
        let title = "", icon = "", colorClass = "";

        if (rand < 8) {
            SoundEngine.playSound('gachaWin');
            title = "神話級"; icon = "👑"; gainedXP = 1000;
            colorClass = "from-yellow-400 to-orange-600 shadow-[0_0_15px_rgba(250,204,21,0.6)]";
        } else if (rand < 45) {
            SoundEngine.playSound('gachaWin');
            title = "稀有"; icon = "💎"; gainedXP = 200;
            colorClass = "from-blue-400 to-indigo-600";
        } else {
            SoundEngine.playSound('gachaFail');
            title = "普通"; icon = "🎁"; gainedXP = 50;
            colorClass = "from-slate-500 to-slate-700";
        }

        // 顯示結果卡片
        resultDiv.innerHTML = `
            <div class="mt-4 p-0.5 rounded-2xl bg-gradient-to-br ${colorClass} animate-bounce-short">
                <div class="bg-slate-900/60 backdrop-blur-md rounded-2xl p-6 flex flex-col items-center">
                    <span class="text-4xl mb-2">${icon}</span>
                    <h3 class="text-xl font-bold text-white">${title}獎勵</h3>
                    <div class="text-3xl font-black text-yellow-300">+${gainedXP} XP</div>
                </div>
            </div>
        `;

        // 1. 本機 XP 更新
        Auth.updateUser('xp', (user.xp || 0) + gainedXP);
        ThemeEngine.apply(Auth.getCurrentUser().xp);

        // 2. 🌟 存入雲端 (包含 timestamp 讓 updateTicketUI 可以判斷日期)
        try {
            await fetch(GAS_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({
                    action: "save_record",
                    username: user.username,
                    activity: "幸運抽獎",
                    score: gainedXP,
                    xp: gainedXP,
                    timestamp: new Date().toISOString(), // 確保帶上時間戳記
                    detail: JSON.stringify({ prize: title })
                })
            });
            
            // 3. 抽完後，立即重新整理次數
            await updateTicketUI();
            
        } catch (e) {
            console.error("雲端同步失敗", e);
        }

        btn.classList.remove('opacity-70', 'animate-pulse');
    }, 2000);
}
function renderUnlockedFeatures(userXp) {
    const listContainer = document.getElementById('unlockedFeaturesList');
    if (!listContainer) return;
    listContainer.innerHTML = ''; 

    featuresList.forEach(feature => {
        const isUnlocked = userXp >= feature.xp; 
        const li = document.createElement('li');
        li.className = `p-3 rounded-2xl border ${isUnlocked ? 'bg-indigo-50 border-indigo-100' : 'bg-slate-50 border-slate-100 opacity-60'} flex items-center justify-between transition-all duration-300`;
        li.innerHTML = `
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full flex items-center justify-center ${isUnlocked ? 'bg-indigo-500 text-white shadow-md' : 'bg-slate-200 text-slate-400'}">
                    <i class="fas ${feature.icon}"></i>
                </div>
                <div>
                    <div class="font-bold ${isUnlocked ? 'text-slate-800' : 'text-slate-500'}">${feature.name}</div>
                    <div class="text-[11px] ${isUnlocked ? 'text-indigo-600' : 'text-slate-400'}">${feature.desc}</div>
                </div>
            </div>
            <div class="text-right">
                ${isUnlocked 
                    ? '<i class="fas fa-unlock-alt text-emerald-500 text-lg drop-shadow-sm"></i>' 
                    : `<div class="text-[10px] font-black text-slate-400"><i class="fas fa-lock"></i> 需 ${feature.xp} XP</div>`
                }
            </div>
        `;
        listContainer.appendChild(li);
    });
}

async function initProfile() {
    let user = Auth.getCurrentUser();
    if (!user || user.username === 'guest') {
        const playerNameEl = document.getElementById('playerName');
        if (playerNameEl) playerNameEl.textContent = "訪客";
        return;
    }

    document.getElementById('sideUserName').textContent = user.name || user.username;
    document.getElementById('playerName').textContent = user.name || user.username;

    let currentXP = user.xp || 0; 

    try {
        const response = await fetch(`${GAS_URL}?action=get_leaderboard&t=${new Date().getTime()}`);
        const topPlayers = await response.json();
        const me = topPlayers.find(p => p.username === user.username);

        if (me) {
            currentXP = Number(me.xp) || 0;
            const level = Number(me.level) || 1;
            document.getElementById('playerLevel').textContent = `Lv. ${level}`;
            
            const xpInThisLevel = currentXP % 100; 
            const xpNeeded = 100 - xpInThisLevel;
            
            document.getElementById('xpText').textContent = `${currentXP} XP (總計)`;
            document.getElementById('xpNeeded').textContent = xpNeeded;
            
            setTimeout(() => {
                const xpFill = document.getElementById('xpFill');
                if (xpFill) xpFill.style.width = `${Math.max((xpInThisLevel / 100) * 100, 2)}%`;
            }, 500);
            
            renderUnlockedFeatures(currentXP);
        }
    } catch (error) {
        console.error("XP 同步失敗:", error);
    } finally {
        // ✅ 修正點：使用新的主題引擎！
        ThemeEngine.apply(currentXP); 
    }
}

async function loadLeaderboard() {
    const listContainer = document.getElementById('leaderboardList');
    const loadingMsg = document.getElementById('loadingMsg');

    try {
        const response = await fetch(`${GAS_URL}?action=get_leaderboard`);
        const topPlayers = await response.json();
        
        loadingMsg.style.display = 'none'; 
        listContainer.innerHTML = ""; 

        if (!topPlayers || topPlayers.length === 0 || topPlayers.error) {
            listContainer.innerHTML = "<li class='text-center py-10 text-slate-400 font-medium bg-slate-50 rounded-2xl'>目前尚無排名紀錄</li>";
            return;
        }

        topPlayers.forEach((player, index) => {
            const li = document.createElement('li');
            const rank = getRankInfo(player.xp); 

            li.className = `flex items-center justify-between p-4 ${rank.bg} ${rank.text} hover:scale-[1.02] border border-transparent rounded-2xl transition-all duration-300 mb-3 shadow-sm`;
            
            let rankDisplay = `<span class="font-bold text-xl">${index + 1}</span>`;
            if (index === 0) rankDisplay = '<i class="fas fa-crown text-3xl text-yellow-400"></i>';
            else if (index === 1) rankDisplay = '<i class="fas fa-medal text-3xl text-slate-300"></i>';
            else if (index === 2) rankDisplay = '<i class="fas fa-award text-3xl text-amber-500"></i>';

            li.innerHTML = `
                <div class="flex items-center gap-4">
                    <div class="w-12 text-center">${rankDisplay}</div>
                    <div>
                        <div class="font-extrabold text-lg flex items-center gap-2">
                            ${player.name || player.username}
                        </div>
                        <div class="text-[11px] font-black px-3 py-0.5 rounded-full inline-block mt-1 ${rank.badge}">
                            ${rank.title}
                        </div>
                    </div>
                </div>
                <div class="text-right">
                    <div class="font-black text-2xl">
                        ${player.xp.toLocaleString()} <span class="text-[10px] opacity-70">XP</span>
                    </div>
                </div>
            `;
            listContainer.appendChild(li);
        });
    } catch (error) {
        loadingMsg.innerHTML = "<span class='text-red-500 font-bold'>伺服器連線失敗</span>";
    }
}

document.addEventListener('DOMContentLoaded', () => {
    SoundEngine.init();
    updateTicketUI();
    initProfile();
    loadLeaderboard();

    const currentUser = (window.Auth && Auth.getCurrentUser()) || JSON.parse(localStorage.getItem('currentUser') || '{}');
    if (currentUser && currentUser.xp !== undefined) {
        ThemeEngine.apply(currentUser.xp);
    }
    
    // 🎵 極速啟動音樂邏輯
    const startMusic = () => {
        SoundEngine.playBGM();
        // 只要播成功了，就拆掉所有監聽器，避免重複執行
        ['mousedown', 'keydown', 'touchstart'].forEach(event => {
            window.removeEventListener(event, startMusic);
        });
    };

    // 1. 嘗試直接播 (如果使用者是從站內連結點過來的，這行會成功)
    SoundEngine.playBGM();

    // 2. 萬一被擋，監聽最輕微的動作 (按下滑鼠、敲鍵盤、手機觸碰)
    // 使用 mousedown 會比 click 更快響起音樂！
    ['mousedown', 'keydown', 'touchstart'].forEach(event => {
        window.addEventListener(event, startMusic, { once: true });
    });
});
    // 🏆 這是處理點擊進入的專用函式
function handleStart() {
    console.log("偵測到點擊，啟動中...");
    
    // 1. 嘗試播放音樂
    if (typeof SoundEngine !== 'undefined') {
        SoundEngine.playBGM();
    }

    // 2. 移除遮罩
    const overlay = document.getElementById('start-overlay');
    if (overlay) {
        overlay.style.transition = 'all 0.4s ease';
        overlay.style.opacity = '0';
        overlay.style.pointerEvents = 'none'; // 讓它點不到，防止卡住
        
        setTimeout(() => {
            overlay.remove(); // 直接從 HTML 裡面刪掉，徹底消除
        }, 500);
    }
}
